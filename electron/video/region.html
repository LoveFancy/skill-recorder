<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none'"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;cursor:crosshair;user-select:none;font-family:system-ui}#box{position:absolute;border:2px solid #ff5935;box-sizing:border-box;box-shadow:0 0 0 9999px #0005;display:none;pointer-events:none}#hint{position:absolute;top:24px;left:50%;transform:translateX(-50%);background:#222e;color:white;border-radius:10px;padding:14px 20px;font-size:16px;pointer-events:none}#tools{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:12px;background:#222e;color:white;padding:10px;border-radius:10px;cursor:default}button{padding:10px 18px;border:0;border-radius:6px;font-size:15px;cursor:pointer}#confirm{background:#ff5935;color:white}#limit{position:absolute;border:1px dashed #fff8;pointer-events:none;box-sizing:border-box}
#click{position:absolute;display:none;width:36px;height:36px;transform:translate(-50%,-50%);border:3px solid white;border-radius:50%;background:#ff593550;box-shadow:0 0 0 2px #ff5935;pointer-events:none}#click::after{content:"";position:absolute;inset:11px;background:#ff5935;border-radius:50%}#hint{max-width:calc(100% - 48px);box-sizing:border-box;font-size:14px;text-align:center}#tools{white-space:nowrap}</style></head><body><div id="click"></div><div id="limit"></div><div id="box"></div><div id="hint"></div><div id="tools"><button id="cancel">取消（Esc）</button><button id="confirm" disabled>确认（Enter）</button></div></body></html>
