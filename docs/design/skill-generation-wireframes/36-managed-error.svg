<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="1200" height="900" rx="0" fill="#f2f2f2" stroke="#ccc" /><text x="30" y="30" font-size="13" font-weight="400" fill="#777">技能录制器 · 原窗口保留在后方</text><rect x="48" y="54" width="1104" height="798" rx="14" fill="white" stroke="#ccc" /><rect x="48" y="54" width="252" height="798" rx="14" fill="#f7f7f7" stroke="#ccc" /><text x="78" y="99" font-size="24" font-weight="600" fill="#292929">设置</text><a href="#01-home" data-screen="01-home"><text x="1110" y="98" font-size="26" font-weight="400" fill="#292929">×</text></a><a href="#01-home" data-screen="01-home"><text x="78" y="148" font-size="16" font-weight="400" fill="#292929">‹ 返回应用</text></a><a href="#30-general" data-screen="30-general"><text x="86" y="209" font-size="16" font-weight="400" fill="#292929">通用</text></a><a href="#31-browser" data-screen="31-browser"><text x="86" y="266" font-size="16" font-weight="400" fill="#292929">浏览器插件</text></a><a href="#05-api-fallback" data-screen="05-api-fallback"><text x="86" y="323" font-size="16" font-weight="400" fill="#292929">AI 模型</text></a><a href="#02-settings" data-screen="02-settings"><rect x="66" y="352" width="216" height="44" rx="8" fill="#e8e8e8" stroke="#ccc" /><text x="86" y="380" font-size="16" font-weight="600" fill="#292929">Agent 能力</text></a><a href="#32-capture-settings" data-screen="32-capture-settings"><text x="86" y="437" font-size="16" font-weight="400" fill="#292929">语音转写</text></a><a href="#37-privacy-settings" data-screen="37-privacy-settings"><text x="86" y="494" font-size="16" font-weight="400" fill="#292929">隐私保护</text></a><text x="78" y="787" font-size="12" font-weight="400" fill="#777">所有页面共用这些配置</text><text x="78" y="810" font-size="12" font-weight="400" fill="#777">不会自动修改当前运行任务</text><text x="338" y="98" font-size="14" font-weight="400" fill="#777">设置  /  Agent 能力</text><text x="350" y="155" font-size="25" font-weight="600" fill="#292929">专用环境 · 需要处理</text><text x="350" y="187" font-size="14" font-weight="400" fill="#777">Claude 登录、环境生成、来源读取和加载隔离分别显示状态。</text><rect x="350" y="230" width="750" height="83" rx="8" fill="white" stroke="#ccc" /><text x="370" y="260" font-size="17" font-weight="600" fill="#292929">Claude Code</text><text x="370" y="288" font-size="13" font-weight="400" fill="#777">已安装 · 已登录</text><text x="875" y="260" font-size="14" font-weight="400" fill="#292929">✓ 已就绪</text><rect x="350" y="330" width="750" height="83" rx="8" fill="white" stroke="#ccc" /><text x="370" y="360" font-size="17" font-weight="600" fill="#292929">应用专用配置 v3</text><text x="370" y="388" font-size="13" font-weight="400" fill="#777">上一有效版本保留；2 项候选更改未生效</text><text x="875" y="360" font-size="14" font-weight="400" fill="#292929">✓ 已保存</text><rect x="350" y="446" width="750" height="176" rx="8" fill="#f3f3f3" stroke="#ccc" /><text x="370" y="481" font-size="18" font-weight="600" fill="#292929">! 当前版本无法证明关闭能力不会被自动加载</text><text x="370" y="517" font-size="14" font-weight="400" fill="#292929">不使用提示词冒充隔离；暂停自动加载 MCP / Skills。</text><text x="370" y="550" font-size="14" font-weight="400" fill="#292929">仍可使用受限的基础分析，或导出补充材料进行人工增强。</text><rect x="370" y="570" width="165" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="384" y="595" font-size="14" font-weight="400" fill="#292929">查看脱敏详情</text><rect x="557" y="570" width="145" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="571" y="595" font-size="14" font-weight="400" fill="#292929">重新检查</text><text x="350" y="679" font-size="14" font-weight="400" fill="#292929">设置保存失败：保持原配置有效；待保存选择仍在草稿中。</text><text x="350" y="714" font-size="13" font-weight="400" fill="#777">若环境本身不可写：暂停本地处理，显示修复原因，不静默切换 API。</text><a href="#02-settings" data-screen="02-settings"><rect x="946" y="770" width="154" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="960" y="795" font-size="14" font-weight="400" fill="#292929">返回设置</text></a></svg>