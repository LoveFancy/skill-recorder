<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="1200" height="900" rx="0" fill="#f2f2f2" stroke="#ccc" /><text x="30" y="30" font-size="13" font-weight="400" fill="#777">技能录制器 · 原窗口保留在后方</text><rect x="48" y="54" width="1104" height="798" rx="14" fill="white" stroke="#ccc" /><rect x="48" y="54" width="252" height="798" rx="14" fill="#f7f7f7" stroke="#ccc" /><text x="78" y="99" font-size="24" font-weight="600" fill="#292929">设置</text><a href="#01-home" data-screen="01-home"><text x="1110" y="98" font-size="26" font-weight="400" fill="#292929">×</text></a><a href="#01-home" data-screen="01-home"><text x="78" y="148" font-size="16" font-weight="400" fill="#292929">‹ 返回应用</text></a><a href="#30-general" data-screen="30-general"><text x="86" y="209" font-size="16" font-weight="400" fill="#292929">通用</text></a><a href="#31-browser" data-screen="31-browser"><rect x="66" y="238" width="216" height="44" rx="8" fill="#e8e8e8" stroke="#ccc" /><text x="86" y="266" font-size="16" font-weight="600" fill="#292929">浏览器插件</text></a><a href="#05-api-fallback" data-screen="05-api-fallback"><text x="86" y="323" font-size="16" font-weight="400" fill="#292929">AI 模型</text></a><a href="#02-settings" data-screen="02-settings"><text x="86" y="380" font-size="16" font-weight="400" fill="#292929">Agent 能力</text></a><a href="#32-capture-settings" data-screen="32-capture-settings"><text x="86" y="437" font-size="16" font-weight="400" fill="#292929">语音转写</text></a><a href="#37-privacy-settings" data-screen="37-privacy-settings"><text x="86" y="494" font-size="16" font-weight="400" fill="#292929">隐私保护</text></a><text x="78" y="787" font-size="12" font-weight="400" fill="#777">所有页面共用这些配置</text><text x="78" y="810" font-size="12" font-weight="400" fill="#777">不会自动修改当前运行任务</text><text x="338" y="98" font-size="14" font-weight="400" fill="#777">设置  /  浏览器插件</text><text x="350" y="155" font-size="25" font-weight="600" fill="#292929">浏览器插件</text><text x="350" y="187" font-size="14" font-weight="400" fill="#777">录制启动后覆盖浏览器中的多个标签页；不要求逐页绑定。</text><rect x="350" y="226" width="750" height="83" rx="8" fill="white" stroke="#ccc" /><text x="370" y="256" font-size="17" font-weight="600" fill="#292929">Chrome</text><text x="370" y="284" font-size="13" font-weight="400" fill="#777">扩展 0.7.x · 桥接正常 · 最近心跳刚刚</text><text x="875" y="256" font-size="14" font-weight="400" fill="#292929">✓ 已连接</text><rect x="350" y="325" width="130" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="364" y="350" font-size="14" font-weight="400" fill="#292929">刷新状态</text><rect x="496" y="325" width="130" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="510" y="350" font-size="14" font-weight="400" fill="#292929">重新连接</text><rect x="350" y="398" width="750" height="83" rx="8" fill="white" stroke="#ccc" /><text x="370" y="428" font-size="17" font-weight="600" fill="#292929">Edge</text><text x="370" y="456" font-size="13" font-weight="400" fill="#777">尚未检测到连接；点击安装说明或手工重新连接。</text><text x="875" y="428" font-size="14" font-weight="400" fill="#292929">○ 未连接</text><rect x="350" y="497" width="180" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="364" y="522" font-size="14" font-weight="400" fill="#292929">安装 / 更新插件</text><rect x="548" y="497" width="130" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="562" y="522" font-size="14" font-weight="400" fill="#292929">重新连接</text><path d="M350 568 H1100" stroke="#ddd" /><text x="350" y="610" font-size="18" font-weight="600" fill="#292929">插件安装与诊断</text><text x="350" y="645" font-size="15" font-weight="400" fill="#292929">查看插件目录 / 复制路径 / 打开安装说明 / 查看脱敏异常详情</text><text x="350" y="693" font-size="14" font-weight="400" fill="#777">状态分别显示：未安装、待连接、已连接、录制中、连接异常。</text><text x="350" y="727" font-size="14" font-weight="400" fill="#777">未连接是中性提示；实际连接失败时仅对应浏览器显示异常。</text></svg>