<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="1200" height="900" rx="0" fill="#f2f2f2" stroke="#ccc" /><text x="30" y="30" font-size="13" font-weight="400" fill="#777">技能录制器 · 原窗口保留在后方</text><rect x="48" y="54" width="1104" height="798" rx="14" fill="white" stroke="#ccc" /><rect x="48" y="54" width="252" height="798" rx="14" fill="#f7f7f7" stroke="#ccc" /><text x="78" y="99" font-size="24" font-weight="600" fill="#292929">设置</text><a href="#01-home" data-screen="01-home"><text x="1110" y="98" font-size="26" font-weight="400" fill="#292929">×</text></a><a href="#01-home" data-screen="01-home"><text x="78" y="148" font-size="16" font-weight="400" fill="#292929">‹ 返回应用</text></a><a href="#30-general" data-screen="30-general"><text x="86" y="209" font-size="16" font-weight="400" fill="#292929">通用</text></a><a href="#31-browser" data-screen="31-browser"><text x="86" y="266" font-size="16" font-weight="400" fill="#292929">浏览器插件</text></a><a href="#05-api-fallback" data-screen="05-api-fallback"><text x="86" y="323" font-size="16" font-weight="400" fill="#292929">AI 模型</text></a><a href="#02-settings" data-screen="02-settings"><text x="86" y="380" font-size="16" font-weight="400" fill="#292929">Agent 能力</text></a><a href="#32-capture-settings" data-screen="32-capture-settings"><rect x="66" y="409" width="216" height="44" rx="8" fill="#e8e8e8" stroke="#ccc" /><text x="86" y="437" font-size="16" font-weight="600" fill="#292929">语音转写</text></a><a href="#37-privacy-settings" data-screen="37-privacy-settings"><text x="86" y="494" font-size="16" font-weight="400" fill="#292929">隐私保护</text></a><text x="78" y="787" font-size="12" font-weight="400" fill="#777">所有页面共用这些配置</text><text x="78" y="810" font-size="12" font-weight="400" fill="#777">不会自动修改当前运行任务</text><text x="338" y="98" font-size="14" font-weight="400" fill="#777">设置  /  语音转写</text><text x="350" y="155" font-size="25" font-weight="600" fill="#292929">语音转写</text><text x="350" y="187" font-size="14" font-weight="400" fill="#777">管理默认语言与本地语音模型；旁白开关和麦克风仍在首页选择。</text><rect x="350" y="230" width="750" height="83" rx="8" fill="white" stroke="#ccc" /><text x="370" y="260" font-size="17" font-weight="600" fill="#292929">语音转写</text><text x="370" y="288" font-size="13" font-weight="400" fill="#777">SenseVoice · 本地模型已就绪</text><text x="875" y="260" font-size="14" font-weight="400" fill="#292929">✓ 已就绪</text><text x="350" y="360" font-size="17" font-weight="600" fill="#292929">默认语言</text><rect x="350" y="378" width="750" height="46" rx="8" fill="white" stroke="#ccc" /><text x="370" y="408" font-size="16" font-weight="400" fill="#292929">中文</text><text x="1060" y="408" font-size="16" font-weight="400" fill="#292929">▾</text><text x="350" y="490" font-size="14" font-weight="400" fill="#777">旁白开关、麦克风选择仍保留在首页，方便每次录制调整。</text><text x="350" y="530" font-size="14" font-weight="400" fill="#777">录制期间与本次采集冲突的配置禁用，并说明停止录制后可修改。</text><rect x="948" y="745" width="152" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="962" y="770" font-size="14" font-weight="400" fill="#292929">保存设置</text></svg>