<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="960" rx="14" fill="#f7f7f7" stroke="#292929" /><rect x="0" y="0" width="1200" height="36" rx="0" fill="white" stroke="none" /><circle cx="18" cy="18" r="6" fill="#dddddd" /><circle cx="38" cy="18" r="6" fill="#dddddd" /><circle cx="58" cy="18" r="6" fill="#dddddd" /><text x="84" y="24" font-size="15" font-weight="600" fill="#787878" text-anchor="start">技能录制器</text><line x1="0" y1="36" x2="1200" y2="36" stroke="#cccccc" /><line x1="300" y1="36" x2="300" y2="960" stroke="#cccccc" /><text x="18" y="69" font-size="13" font-weight="400" fill="#787878" text-anchor="start">录制记录</text><rect x="94" y="49" width="32" height="28" rx="8" fill="#f7f7f7" stroke="none" /><text x="110.0" y="69" font-size="12" font-weight="400" fill="#787878" text-anchor="middle">17</text><rect x="12" y="87" width="274" height="88" rx="10" fill="#eeeeee" stroke="#292929" /><text x="24" y="111" font-size="12" font-weight="400" fill="#787878" text-anchor="start">10月13日 20:31</text><text x="225" y="111" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已分析</text><text x="24" y="136" font-size="15" font-weight="600" fill="#292929" text-anchor="start">发送订单报价单</text><text x="24" y="159" font-size="10" font-weight="400" fill="#787878" text-anchor="start">4分32秒  8.1 MB  5 steps  视频  旁白</text><rect x="12" y="185" width="274" height="88" rx="10" fill="white" stroke="#cccccc" /><text x="24" y="209" font-size="12" font-weight="400" fill="#787878" text-anchor="start">10月13日 20:29</text><text x="225" y="209" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已录制</text><text x="24" y="234" font-size="15" font-weight="600" fill="#292929" text-anchor="start">尚未分析</text><text x="24" y="257" font-size="10" font-weight="400" fill="#787878" text-anchor="start">27秒  872.7 KB  视频  旁白</text><rect x="12" y="283" width="274" height="88" rx="10" fill="white" stroke="#cccccc" /><text x="24" y="307" font-size="12" font-weight="400" fill="#787878" text-anchor="start">10月13日 11:18</text><text x="225" y="307" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已分析</text><text x="24" y="332" font-size="15" font-weight="600" fill="#292929" text-anchor="start">浏览百度热搜话题</text><text x="24" y="355" font-size="10" font-weight="400" fill="#787878" text-anchor="start">30秒  3.9 MB  4 steps  视频  旁白</text><rect x="12" y="381" width="274" height="88" rx="10" fill="white" stroke="#cccccc" /><text x="24" y="405" font-size="12" font-weight="400" fill="#787878" text-anchor="start">10月13日 11:05</text><text x="225" y="405" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已录制</text><text x="24" y="430" font-size="15" font-weight="600" fill="#292929" text-anchor="start">尚未分析</text><text x="24" y="453" font-size="10" font-weight="400" fill="#787878" text-anchor="start">42秒  2.2 MB  视频  旁白</text><rect x="12" y="479" width="274" height="88" rx="10" fill="white" stroke="#cccccc" /><text x="24" y="503" font-size="12" font-weight="400" fill="#787878" text-anchor="start">10月12日 21:23</text><text x="225" y="503" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已录制</text><text x="24" y="528" font-size="15" font-weight="600" fill="#292929" text-anchor="start">尚未分析</text><text x="24" y="551" font-size="10" font-weight="400" fill="#787878" text-anchor="start">11秒  776.4 KB  视频  旁白</text><rect x="12" y="577" width="274" height="88" rx="10" fill="white" stroke="#cccccc" /><text x="24" y="601" font-size="12" font-weight="400" fill="#787878" text-anchor="start">10月12日 21:22</text><text x="225" y="601" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已录制</text><text x="24" y="626" font-size="15" font-weight="600" fill="#292929" text-anchor="start">尚未分析</text><text x="24" y="649" font-size="10" font-weight="400" fill="#787878" text-anchor="start">39秒  1.7 MB  视频  旁白</text><rect x="12" y="675" width="274" height="88" rx="10" fill="white" stroke="#cccccc" /><text x="24" y="699" font-size="12" font-weight="400" fill="#787878" text-anchor="start">10月12日 21:06</text><text x="225" y="699" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已分析</text><text x="24" y="724" font-size="15" font-weight="600" fill="#292929" text-anchor="start">整理工作簿</text><text x="24" y="747" font-size="10" font-weight="400" fill="#787878" text-anchor="start">16秒  966.9 KB  3 steps  视频  旁白</text><rect x="12" y="773" width="274" height="88" rx="10" fill="white" stroke="#cccccc" /><text x="24" y="797" font-size="12" font-weight="400" fill="#787878" text-anchor="start">10月10日 13:24</text><text x="225" y="797" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已分析</text><text x="24" y="822" font-size="15" font-weight="600" fill="#292929" text-anchor="start">导出订单报表</text><text x="24" y="845" font-size="10" font-weight="400" fill="#787878" text-anchor="start">1分23秒  3.5 MB  6 steps  视频</text><rect x="290" y="90" width="5" height="510" rx="3" fill="#cccccc" stroke="none" /><text x="332" y="77" font-size="14" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">创建</text><text x="470" y="77" font-size="14" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">10月13日 20:31</text><a href="#08-analysis" data-screen="08-analysis" aria-label="返回分析" transform="translate(0,60) "><rect x="1092" y="52" width="84" height="38" rx="10" fill="#f7f7f7" stroke="#cccccc" /><text x="1134.0" y="76.0" font-size="14" font-weight="400" fill="#292929" text-anchor="middle">返回分析</text></a><line x1="300" y1="100" x2="1200" y2="100" stroke="#cccccc" transform="translate(0,60) " /><text x="348" y="145" font-size="22" font-weight="600" fill="#292929" text-anchor="start" transform="translate(0,60) ">通用智能体 Skill · 依赖仍需确认</text><text x="348" y="176" font-size="14" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">保留已确认的业务规则；不会把 本地 MCP 当成通用依赖。</text><rect x="348" y="204" width="804" height="168" rx="12" fill="white" stroke="#cccccc" transform="translate(0,60) " /><text x="370" y="241" font-size="18" font-weight="600" fill="#292929" text-anchor="start" transform="translate(0,60) ">已审核的内容</text><text x="370" y="280" font-size="15" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">输入订单号；只处理已支付的指定订单。</text><text x="370" y="314" font-size="15" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">联系人和附件需查询；发送前确认正文和附件。</text><rect x="348" y="404" width="804" height="216" rx="12" fill="white" stroke="#cccccc" transform="translate(0,60) " /><text x="370" y="441" font-size="18" font-weight="600" fill="#292929" text-anchor="start" transform="translate(0,60) ">可移植接口尚未确定</text><text x="370" y="482" font-size="14" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">当前只核验了本地 MCP，没有已核验的通用 CLI 或 HTTP 接口。</text><text x="370" y="514" font-size="14" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">本地 MCP 无法直接用于此通用目标，需要可移植接口。</text><text x="370" y="546" font-size="14" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">需补充可移植能力或确认调整输入来源，再生成正式内容。</text><rect x="370" y="563" width="212" height="38" rx="10" fill="#f7f7f7" stroke="#cccccc" transform="translate(0,60) " /><text x="476.0" y="587.0" font-size="14" font-weight="400" fill="#292929" text-anchor="middle" transform="translate(0,60) ">补充通用能力说明</text><a href="#20-create-targets" data-screen="20-create-targets" transform="translate(0,60) "><text x="907" y="588" font-size="14" font-weight="400" fill="#787878" text-anchor="start">选择 Claude Code 目标</text></a><rect x="348" y="659" width="804" height="48" rx="12" fill="white" stroke="#cccccc" transform="translate(0,60) " /><text x="364" y="687" font-size="14" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">现在可以保存含依赖缺口的草稿；草稿不得声称依赖已核验。</text><rect x="301" y="840" width="898" height="59" rx="0" fill="#f7f7f7" stroke="none" transform="translate(0,60) " /><line x1="300" y1="840" x2="1200" y2="840" stroke="#cccccc" transform="translate(0,60) " /><text x="332" y="874" font-size="12" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">通用目标的能力约束与 Claude Code 目标不同。</text><rect x="1000" y="853" width="176" height="38" rx="10" fill="#292929" stroke="none" transform="translate(0,60) " /><text x="1088.0" y="877.0" font-size="14" font-weight="600" fill="white" text-anchor="middle" transform="translate(0,60) ">导出通用草稿</text><a href="#20-create-targets" data-screen="20-create-targets" aria-label="返回目标选择" transform="translate(0,60) "><rect x="822" y="853" width="162" height="38" rx="10" fill="#f7f7f7" stroke="#cccccc" /><text x="903.0" y="877.0" font-size="14" font-weight="400" fill="#292929" text-anchor="middle">返回目标选择</text></a><rect x="301" y="36" width="898" height="60" rx="0" fill="white" stroke="none" /><a href="#08-analysis" data-screen="08-analysis"><text x="332" y="64" font-size="17" font-weight="400" fill="#787878" text-anchor="start">分析</text><text x="375" y="64" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已分析</text></a><text x="477" y="65" font-size="18" font-weight="400" fill="#787878" text-anchor="start">›</text><a href="#12-facts" data-screen="12-facts"><text x="510" y="64" font-size="17" font-weight="400" fill="#787878" text-anchor="start">澄清和补充</text><text x="610" y="64" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已审核</text></a><text x="655" y="65" font-size="18" font-weight="400" fill="#787878" text-anchor="start">›</text><a href="#28-generic-plan" data-screen="28-generic-plan"><text x="688" y="64" font-size="17" font-weight="600" fill="#292929" text-anchor="start">生成</text><text x="731" y="64" font-size="11" font-weight="400" fill="#787878" text-anchor="start">待确认</text><line x1="688" y1="87" x2="814" y2="87" stroke="#292929" /></a><text x="1159" y="65" font-size="12" font-weight="400" fill="#787878" text-anchor="end">同一条录制</text><line x1="300" y1="96" x2="1200" y2="96" stroke="#cccccc" /></svg>