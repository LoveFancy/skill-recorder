"400" fill="#787878" text-anchor="start" transform="translate(0,60) ">已确认补充内容，结合录制分析、目标和回答整理候选。</text><rect x="348" y="204" width="804" height="67" rx="12" fill="white" stroke="#cccccc" transform="translate(0,60) " /><text x="370" y="244" font-size="17" font-weight="600" fill="#292929" text-anchor="start" transform="translate(0,60) ">… 正在核对已有材料与业务规则</text><a href="#16-recovery" data-screen="16-recovery" transform="translate(0,60) "><text x="1068" y="244" font-size="14" font-weight="400" fill="#787878" text-anchor="start">取消</text></a><text x="348" y="312" font-size="14" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">正在处理已有材料 · 已用时 01:18（示例）</text><rect x="348" y="342" width="804" height="93" rx="12" fill="white" stroke="#cccccc" transform="translate(0,60) " /><text x="370" y="375" font-size="17" font-weight="600" fill="#292929" text-anchor="start" transform="translate(0,60) ">✓ 已读取完整补充材料</text><text x="370" y="405" font-size="14" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">记录订单范围、联系人来源与发送前确认要求。</text><rect x="348" y="452" width="804" height="93" rx="12" fill="white" stroke="#cccccc" transform="translate(0,60) " /><text x="370" y="485" font-size="17" font-weight="600" fill="#292929" text-anchor="start" transform="translate(0,60) ">✓ 已整理录制中的附件线索</text><text x="370" y="515" font-size="14" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">仅有名称线索，附件身份仍作为缺口保留。</text><rect x="348" y="562" width="804" height="93" rx="12" fill="white" stroke="#cccccc" transform="translate(0,60) " /><text x="370" y="595" font-size="17" font-weight="600" fill="#292929" text-anchor="start" transform="translate(0,60) ">… 核对分析与用户确认规则</text><text x="370" y="625" font-size="14" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">不自动查询业务系统；需要外部证据时转人工补充。</text><text x="348" y="712" font-size="14" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">▸ 查看工具调用摘要</text><text x="348" y="761" font-size="12" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">已保存补充材料与进度。新增冲突会集中提示，修改回答后再确认新版补充内容。</text><rect x="301" y="840" width="898" height="59" rx="0" fill="#f7f7f7" stroke="none" transform="translate(0,60) " /><line x1="300" y1="840" x2="1200" y2="840" stroke="#cccccc" transform="translate(0,60) " /><text x="332" y="874" font-size="12" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">整理尚未完成，暂不能审核最终结果。</text><rect x="1000" y="853" width="176" height="38" rx="10" fill="#f7f7f7" stroke="#cccccc" transform="translate(0,60) " /><text x="1088.0" y="877.0" font-size="14" font-weight="400" fill="#787878" text-anchor="middle" transform="translate(0,60) ">等待增强完成</text><a href="#16-recovery" data-screen="16-recovery" aria-label="取消并保留成果" transform="translate(0,60) "><rect x="822" y="853" width="162" height="38" rx="10" fill="#f7f7f7" stroke="#cccccc" /><text x="903.0" y="877.0" font-size="14" font-weight="400" fill="#292929" text-anchor="middle">取消并保留成果</text></a><rect x="301" y="36" width="898" height="60" rx="0" fill="white" stroke="none" /><a href="#08-analysis" data-screen="08-analysis"><text x="332" y="64" font-size="17" font-weight="400" fill="#787878" text-anchor="start">分析</text><text x="375" y="64" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已分析</text></a><text x="477" y="65" font-size="18" font-weight="400" fill="#787878" text-anchor="start">›</text><a href="#10-enhancing" data-screen="10-enhancing"><text x="510" y="64" font-size="17" font-weight="600" fill="#292929" text-anchor="start">澄清和补充</text><text x="610" y="64" font-size="11" font-weight="400" fill="#787878" text-anchor="start">增强中</text><line x1="510" y1="87" x2="636" y2="87" stroke="#292929" /></a><text x="655" y="65" font-size="18" font-weight="400" fill="#787878" text-anchor="start">›</text><a href="#23-generation-pending" data-screen="23-generation-pending">