<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>生成与发布 · Skill Recorder 设计稿 v12</title>
<style>
:root{--deck:#faf8f5;--surface:#fff;--line:#dedede;--text:#242424;--muted:#747474;--brand:#e0341e;--soft:#f0efec;--green:#08754e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:#e9e8e5;font-size:13px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;background:white;padding:9px 14px}button:hover:not(:disabled){border-color:#a4a4a0}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:3px}input,select,textarea{border:1px solid var(--line);border-radius:7px;background:white;padding:10px 12px;min-width:0}textarea{resize:vertical;min-height:82px}input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand);margin:2px 0 0;flex:none}h1,h2,h3,p{margin:0}h1{font-size:25px;line-height:1.4;font-weight:600}h2{font-size:16px;font-weight:600}h3{font-size:13px;font-weight:600}.muted{color:var(--muted)}.primary{background:var(--brand);border-color:var(--brand);color:white;font-weight:600;padding:11px 20px}.link{border:0;background:transparent;color:var(--muted);padding:8px 0}.demo-bar{max-width:1280px;margin:14px auto 10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:0 18px;color:#555;font-size:12px}.demo-bar strong{color:#222}.demo-bar select{padding:6px 10px;max-width:100%}.demo-bar a{color:inherit}.app{height:900px;max-height:calc(100vh - 88px);min-height:580px;width:calc(100% - 36px);max-width:1280px;margin:auto;border:1px solid #d1d0cd;border-radius:12px;background:var(--deck);display:grid;grid-template-columns:208px minmax(0,1fr);overflow:hidden;box-shadow:0 8px 28px #00000008}.sidebar{background:#f7f6f3;border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:12px}.sidebar header{display:flex;align-items:center;justify-content:space-between;padding:0 4px 14px;font-size:14px}.record{border:1px solid var(--line);border-radius:10px;background:white;padding:16px 14px;display:grid;gap:10px}.record.active{border-color:var(--brand);background:#f4f0eb}.record small{font-size:11px;color:var(--muted)}.record b{font-size:13px;font-weight:500}.side-bottom{margin-top:auto;padding:12px 4px;color:var(--muted)}.workspace{display:flex;flex-direction:column;min-width:0;min-height:0}.steps{display:flex;align-items:center;gap:7px;padding:17px 22px;background:white;border-bottom:1px solid var(--line);flex:none}.steps button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:10px 12px;white-space:nowrap}.steps .active{background:var(--soft);font-weight:600}.steps small{color:var(--muted);font-weight:400;font-size:10px}.arrow{color:#aaa}.context{padding:12px 32px;display:flex;gap:14px;align-items:center;font-size:12px}.context select{padding:7px 30px 7px 10px}.page-head{padding:18px 38px 24px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.kicker{display:block;font-size:11px;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}.page-head p{font-size:13px;line-height:1.7;color:var(--muted);margin-top:10px}.page-head>button{margin-top:8px;flex:none}.body{overflow-y:auto;flex:1;min-height:0;padding:26px 38px;display:flex;flex-direction:column;gap:22px}.card{background:white;border:1px solid var(--line);border-radius:11px;padding:22px}.card-head{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}.card-head small{font-size:11px;color:var(--muted)}.field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;font-size:12px;line-height:1.6;font-weight:500}.field:last-child{margin-bottom:0}.field input,.field textarea,.field select{font-size:13px;font-weight:400;width:100%}.field small{color:var(--muted);font-weight:400;font-size:11px}.details{padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.8}.details summary{cursor:pointer}.details p{margin-top:8px}.check{display:flex;align-items:flex-start;gap:10px;line-height:1.8;font-size:12px;color:var(--muted);cursor:pointer}.check strong{color:var(--text);font-weight:500}.source h3{margin-bottom:12px}.foot{padding:15px 38px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;flex:none;background:var(--deck)}.foot>p{font-size:12px;color:var(--muted);line-height:1.6}.foot-actions{display:flex;align-items:center;gap:12px}.badge{display:inline-block;border-radius:4px;background:var(--soft);padding:4px 7px;font-size:11px;color:#666;white-space:nowrap}.badge.good{background:#eaf4ee;color:var(--green)}.badge.warn{background:#fbefd9;color:#895719}.notice{padding:13px 15px;border:1px solid #e6d6b9;border-radius:8px;background:#fcf5e8;color:#805d2c;line-height:1.7;font-size:12px}.preview h2{font-size:20px;margin-bottom:12px}.preview p{line-height:1.9;color:#666;font-size:13px}.preview ol{padding-left:24px;margin:20px 0 0}.preview li{padding:0 0 18px 5px;line-height:1.8}.preview li p{margin-top:5px}.preview [contenteditable]{outline-offset:5px}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-top:1px solid var(--line)}.row p{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.7}.outline{padding:0;margin:0;list-style:none;counter-reset:chapter}.outline li{counter-increment:chapter;display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line)}.outline li::before{content:counter(chapter);font-size:12px;color:#888;padding-top:2px}.outline .badge{margin-left:auto;align-self:flex-start}.outline p{font-size:12px;color:var(--muted);line-height:1.8;margin-top:6px}.progress{padding:28px 0}.progress h2{font-size:20px}.progress p{line-height:1.8;margin-top:12px;color:var(--muted)}.progress-list{margin-top:28px;list-style:none;padding:0}.progress-list li{padding:15px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted)}.progress-list .current{color:var(--text);font-weight:500}.publish-grid{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:22px;align-items:start}.product-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.product-choices button{text-align:left;min-height:150px}.product-choices p{margin-top:12px;color:var(--muted);line-height:1.8;font-size:12px}.channels{display:grid;gap:10px;margin:16px 0 22px}.channel{display:flex;text-align:left;align-items:center;gap:13px;padding:15px;background:white}.channel.selected{border-color:#6d6c67;background:#f6f5f1}.channel-mark{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#555;font-size:11px;flex:none}.channel strong{display:block;font-size:13px;font-weight:500}.channel small{display:block;font-size:11px;color:var(--muted);line-height:1.6;margin-top:4px}.radio{width:15px;height:15px;border:1px solid #c4c3be;border-radius:50%;margin-left:auto;flex:none}.selected .radio{border:4px solid #53534e}.destination{border-top:1px solid var(--line);padding-top:20px}.publish-summary{font-size:12px;line-height:1.7}.summary-mobile{display:none}.publish-summary h3{margin-bottom:18px}.publish-summary dl{margin:0}.publish-summary dt{color:var(--muted);margin:14px 0 4px}.publish-summary dd{margin:0;overflow-wrap:anywhere}.publish-summary .mini-preview{border:1px solid var(--line);background:var(--deck);padding:14px;border-radius:7px;margin-top:20px}.mini-preview span{display:block;width:85%;height:5px;background:#e4e2dd;margin-top:10px;border-radius:3px}.result{padding:15px 0}.result-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:#eaf4ee;color:var(--green);font-size:21px;margin-bottom:18px}.result h2{font-size:23px}.result>p{margin-top:12px;color:var(--muted);line-height:1.8}.result .card{margin-top:24px}.url{display:flex;gap:8px;margin:18px 0}.url input{flex:1;width:0;color:#555}.result-actions{display:flex;gap:12px;flex-wrap:wrap}.history{margin-top:24px}.history h3{margin-bottom:12px}.history .row{font-size:12px}.empty{text-align:left;padding:35px 0}.empty h2{font-size:21px}.empty p{margin:14px 0 24px;color:var(--muted);line-height:1.8}.annotations{max-width:1280px;margin:14px auto 30px;padding:16px 20px;font-size:12px;color:#666;line-height:1.9}.annotations summary{cursor:pointer;font-weight:600}.annotations ul{padding-left:20px;margin-bottom:0}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#292929;color:#fff;padding:12px 20px;border-radius:8px;z-index:10;font-size:12px}a{color:var(--brand)}
@media(max-width:1000px){.app{grid-template-columns:170px minmax(0,1fr)}.steps{padding:12px;gap:2px}.steps button{padding:9px 7px;gap:5px;font-size:12px}.steps small{display:none}.body,.page-head{padding-left:24px;padding-right:24px}.publish-grid{grid-template-columns:1fr}.publish-summary{display:none}.summary-mobile{display:block;font-size:12px;color:var(--muted)}.summary-mobile>summary{cursor:pointer}.summary-mobile .publish-summary{display:block;margin-top:14px}.foot{padding:14px 24px}}
@media(max-width:680px){.product-choices{grid-template-columns:1fr}.product-choices button{min-height:110px}.app{width:100%;border-radius:0;border-left:0;border-right:0;grid-template-columns:1fr;height:900px;max-height:calc(100dvh - 115px);min-height:440px}.sidebar{display:none}.steps{justify-content:space-between;padding:10px 8px}.steps button{padding:8px 5px;font-size:11px}.arrow{font-size:10px}.context{padding:12px 20px}.page-head{padding:14px 20px 20px;flex-wrap:wrap;gap:8px}h1{font-size:22px}.body{padding:20px;gap:18px}.card{padding:18px}.foot{padding:12px 20px;flex-wrap:wrap}.foot-actions{margin-left:auto}.demo-bar{gap:7px;margin:8px 0}.demo-bar small{display:none}.annotations{margin-top:8px}.url{flex-wrap:wrap}.url input{min-width:180px}.row{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="demo-bar"><strong>设计稿 v12</strong><span>生成 → 发布与分享</span><label>预览状态 <select id="scenario" aria-label="预览设计状态"></select></label><a href="index.html">v11 历史稿</a><small>交互演示 · 合成数据 · 不调用模型、不发布到外部服务</small></div>
<div class="app" id="app"></div>
<details class="annotations" open><summary>设计说明 · 不出现在产品中</summary><ul id="notes"></ul></details>
<div id="toast" role="status" hidden class="toast"></div>
<script>
const $=s=>document.querySelector(s);
const states={choose:'00 生成 · 三种制品',setup:'01 SOP · 文档设置',manual:'02 使用手册 · 文档设置',generating:'03 生成中',outline:'04 使用手册 · 目录审核',review:'05 SOP · 编辑与审核',draft:'06 待补充草稿',skill:'07 Skill · 保存与依赖',publish:'08 发布 · 飞书文档',wiki:'09 发布 · Wiki',workmate:'10 发布 · Workmate',publishing:'11 发布中',success:'12 发布成功',failure:'13 发布失败',stale:'14 已发布 · 有新版本',blocked:'15 尚未审核',disconnected:'16 目标未连接',unknown:'17 发布结果待确认'};
let state='choose',kind='sop',channel='feishu',confirmed=false,approved=false;
const notes={setup:['沿用已实现的生成页视觉：暖白底、文档设置卡片、来源确认、右下角主按钮。','仅明确点击生成才请求模型；导航与产物切换只加载现有内容，不自动生成。'],manual:['使用手册先调用模型生成目录；目录审核后再调用模型生成正文。','没有证据的章节标待补充，不生成虚构正文。'],generating:['只显示真实阶段与耗时，不展示假百分比或思维链。','取消/失败保留已有修订；重试创建新修订，不覆盖人工编辑。此演示通过按钮推进状态。'],outline:['目录标题与范围可原位修改；“待补充”章节只保留占位。','确认目录不等于确认正文；正文生成后仍需编辑与审核。'],review:['编辑不调用模型；确认内容并保存成功后，开放第四步。','本稿新增发布入口；生成阶段仍保留导出和重新生成。发布页绑定当前审核修订。'],draft:['本稿正式发布只接受当前已审核且无阻断缺口的修订。','草稿可本地导出并带标记，不生成可安装链接；补齐内容并审核后才发布。'],skill:['沿用现有技能计划确认 → 生成 → 预览 → 保存链路，本稿仅展示生成结果。','安装包格式可校验不等于业务执行已验证；依赖和未验证状态随分享页保留。'],publish:['默认不选外部目录；用户选择目标位置后显式发布。','目的地、账号、可见范围、附件与版本均在提交前可核对。示例权限来自合成数据，真实产品须查询。'],wiki:['Wiki 是渠道类别，首个适配器建议飞书知识库；Confluence 等需要单独接入。','必须选择知识空间与父节点；新建与更新已有页面分开，不覆盖不受应用管理的内容。'],workmate:['Skill 发布为兼容性校验通过的插件安装包；SOP/手册是文档资源包，不变为可执行技能。','Workmate 文档资源包、托管及分享服务的契约待接入验证；不可用时禁用发布并提供文件导出。图中仅示意已接入状态。','仅上传审核后的产物和选定资源；不含原始录屏、会话日志、账户凭据或本机路径。'],publishing:['发布由应用侧适配器执行，不把第三方写权限交给文档生成会话。','提交采用固定修订及幂等键；停止等待不等于撤销远端写入。'],success:['确认远端对象与版本后才显示已发布；复制链接是本地动作，不自动发消息或通知他人。','外部权限修改应跳转对应平台；Workmate 分享可停用链接，已安装的副本不自动撤回。'],failure:['授权失效时保留选定目标和本地成果；重新连接后显式重试。','未知结果不直接重发，先核对已有远端对象，避免重复文档。'],stale:['已发布版本固定为当时修订，不自动跟随本地修改；显式更新才写入远端。','上游来源过期时，返回生成并重新审核；仅有新修订且已审核可更新已有发布。'],blocked:['未生成、未审核、来源过期时，发布页展示具体原因及返回操作；导航不替用户审核。'],disconnected:['首次使用先连接渠道账号，再选择目录与权限。连接成功不自动触发发布。','目标不可接入时保持禁用并提供文件导出，不展示假的分享链接。'],unknown:['网络超时可能发生在远端创建成功之后；状态为待确认，不能直接显示失败或成功。','先按幂等请求标识核对远端，再决定继续确认或重试。']};
const label=()=>kind==='manual'?'使用手册':kind==='skill'?'可复用技能':'SOP 操作说明';
const title=()=>kind==='manual'?'报价系统使用手册':kind==='skill'?'客户报价技能':'客户报价操作说明';
const isPublish=()=>['publish','wiki','workmate','publishing','success','failure','stale','blocked','disconnected','unknown'].includes(state);
function go(next){state=next;confirmed=false;if(next==='manual'||next==='outline')kind='manual';if(next==='setup'||next==='draft')kind='sop';if(next==='skill'||next==='workmate')kind='skill';if(next==='publish')channel='feishu';if(next==='wiki')channel='wiki';if(next==='workmate')channel='workmate';if(['skill','publish','wiki','workmate','success','stale'].includes(next))approved=true;location.hash=next;render()}
function field(name,control,help=''){return `<label class="field">${name}${control}${help?`<small>${help}</small>`:''}</label>`}
function foot(hint,actions){return `<footer class="foot"><p>${hint}</p><div class="foot-actions">${actions}</div></footer>`}
function button(text,action,primary=false,disabled=false){return `<button ${action?`data-action="${action}"`:''} class="${primary?'primary':''}" ${disabled?'disabled':''}>${text}</button>`}
function heading(kicker,name,sub,action=''){return `<header class="page-head"><div><span class="kicker">${kicker}</span><h1>${name}</h1><p>${sub}</p></div>${action}</header>`}
function sourceCheck(text){return `<label class="check"><input id="confirm" type="checkbox" ${confirmed?'checked':''}><span>${text}</span></label>`}
function chooser(){return heading('生成','选择要生成的制品','基于这条录制，整理成需要的成果。')+`<main class="body"><div class="product-choices"><button class="card" data-action="setup"><h2>SOP 操作说明</h2><p>按顺序还原实际操作，供人照着完成任务。</p></button><button class="card" data-action="manual"><h2>产品使用手册</h2><p>按功能组织说明，先审核目录，再生成正文。</p></button><button class="card" data-action="skill"><h2>通用 Skill</h2><p>提炼可复用的流程，供支持技能的智能体使用。</p></button></div></main>`}
function setup(){if(kind==='sop')return heading('文档生成',label(),'把录制中的实际操作，整理成清晰、可复现的操作流程。')+'<main class="body"></main>'+foot('生成后可继续编辑与审核。',button('生成 SOP','generate',true));return heading('文档生成',label(),kind==='manual'?'围绕已演示的功能，整理适用范围、操作方法与使用说明。':'把录制中的实际操作，整理成清晰、可复现的操作流程。')+`<main class="body"><section class="card"><div class="card-head"><h2>文档设置</h2><small>${kind==='manual'?'功能使用手册':'标准操作说明'} · v1</small></div>${field('适用读者','<input value="业务操作者">')}${field('覆盖范围','<textarea>本次录制及已确认材料覆盖的任务与功能</textarea>')}<details class="details"><summary>生成说明</summary><p>保留实际操作方式，仅使用基础分析及已审核的补充事实。${kind==='manual'?'先生成目录，确认后再生成正文。':'生成后可编辑、审核并导出。'}</p></details></section><section class="source"><h3>确认文档来源</h3>${sourceCheck('我已确认基础分析可用于制作本次文档；未审核增强不作为事实。')}</section></main>`+foot(kind==='manual'?'先确认目录，再生成正文。':'生成后可继续编辑与审核。',button(kind==='manual'?'生成覆盖目录':'生成 SOP','generate',true,!confirmed))}
function busy(publishing=false){return heading(publishing?'发布与分享':'文档生成',publishing?'正在发布到'+(channel==='wiki'?'知识库':channel==='workmate'?'Workmate':'飞书文档'):'正在整理'+label(),publishing?'使用已审核的修订 3，内容不会在发布中变化。':'依据已确认材料生成，已有版本会保留。')+`<main class="body"><section class="progress"><h2>${publishing?'正在上传文档与截图…':'正在编写'+(kind==='manual'?'功能说明':'操作步骤')+'…'}</h2><p>已用时 00:18</p><ul class="progress-list"><li>准备${publishing?'发布内容':'审核事实'}<span>已完成</span></li><li class="current">${publishing?'提交到目标位置':'整理步骤与证据'}<span>进行中</span></li><li>${publishing?'确认远端版本与链接':'校验并保存草稿'}<span>等待中</span></li></ul></section></main>`+foot(publishing?'离开页面不代表取消远端发布。':'取消后保留已保存版本。',button(publishing?'查看发布记录':'停止生成',publishing?'unknown':'setup')+button('演示：处理完成',publishing?'success':kind==='manual'?'outline':'review'))}
function outline(){return heading('文档生成','审核目录与覆盖范围','确认已覆盖的章节，再生成手册正文。')+`<main class="body"><section class="card"><div class="card-head"><h2>报价系统使用手册</h2><small>3 个章节 · 可直接修改</small></div><ol class="outline"><li><div><h3 contenteditable="true">进入报价工作台</h3><p contenteditable="true">登录后的入口、客户检索与报价页面。</p></div><span class="badge good">已覆盖</span></li><li><div><h3 contenteditable="true">创建并核对报价</h3><p contenteditable="true">选择产品、填写数量，核对金额。</p></div><span class="badge good">已覆盖</span></li><li><div><h3 contenteditable="true">报价审批</h3><p>未录制审批流程；保留待补充占位，不生成操作正文。</p></div><span class="badge warn">待补充</span></li></ol></section></main>`+foot('无证据的章节不会补写为已知操作。',button('返回设置','manual')+button('确认目录并生成正文','body',true))}
function review(){const draft=state==='draft',skill=kind==='skill';return heading('文档生成',skill?'技能已保存':(draft?'检查文档草稿':'编辑与审核'),skill?'检查使用依赖，准备发布给同事。':'核对内容与截图，确认后可发布与分享。',button('重新生成新修订','setup'))+`<main class="body">${draft?'<div class="notice">还有 1 项待补充：尚未确认报价审批规则。可导出草稿，补齐并审核后再正式发布。</div>':''}${skill?'<section class="card"><div class="card-head"><h2>使用此技能需要</h2><span class="badge">业务执行未验证</span></div><p class="muted">报价系统连接、企业邮箱连接。安装后由使用者自行授权；不随分享包提供账户凭据。</p></section>':''}<article class="card preview"><div class="card-head"><h2 contenteditable="true">${title()}</h2><span class="badge ${approved&&!draft?'good':''}">${approved&&!draft?'已审核 · 修订 3':'草稿 · 修订 3'}</span></div><p contenteditable="true">适用于销售专员为已有客户准备产品报价。以本次录制及已确认规则为范围。</p><ol><li><strong contenteditable="true">打开客户的报价工作台</strong><p contenteditable="true">检索客户名称，核对客户身份后进入报价页面。</p></li><li><strong contenteditable="true">选择产品并核对金额</strong><p contenteditable="true">选择产品型号、填写数量，检查单价与报价总额。</p></li><li><strong contenteditable="true">保存并检查报价记录</strong><p contenteditable="true">保存后在列表中检查对应客户、金额和记录状态。</p></li></ol><details class="details"><summary>查看来源与${skill?'工具依赖':'关联截图'}</summary><p>录制于 2026-10-17 · 3 个已确认操作 · 2 张脱敏截图。</p></details></article>${!skill?sourceCheck('我已核对本次文档内容，确认保存为已审核版本。'):''}</main>`+foot(skill?'安装包校验与业务执行验证分别标记。':draft?'草稿保留待补充标记。':'保存成功后，可进入发布与分享。',button(draft?'导出草稿':'导出文件','export')+button(skill?'下一步：发布与分享':'确认并保存，去发布',draft?'blocked':'to-publish',true,!skill&&(!confirmed||draft)))}
function channelRow(id,mark,name,desc){return `<button class="channel ${channel===id?'selected':''}" data-channel="${id}" aria-pressed="${channel===id}"><span class="channel-mark">${mark}</span><span><strong>${name}</strong><small>${desc}</small></span><span class="radio"></span></button>`}
function destination(){if(state==='disconnected')return `<div class="destination"><div class="notice">尚未连接${channel==='wiki'?'知识库':channel==='workmate'?'Workmate':'飞书'}账号。连接后再选择发布位置，不会自动发布。</div><p style="margin-top:14px">${button('连接账号','connect')}</p></div>`;const workmate=channel==='workmate';return `<div class="destination"><div class="row" style="border:0;padding:0 0 18px"><span class="muted" style="font-size:12px">发布账号 · 秦晓 / 示例企业</span><span class="badge good">已连接</span></div>${field('发布标题',`<input value="${title()}">`)}${channel==='wiki'?field('知识库平台','<select><option>飞书知识库</option><option disabled>Confluence · 待接入</option></select>'):''}${workmate?field('发布形式',`<input readonly value="${kind==='skill'?'可安装插件 · 包含技能及依赖声明':'文档资源包 · 安装后查阅，不执行操作'}">`):field(channel==='wiki'?'知识空间与父页面':'发布位置',`<select id="destination"><option value="">请选择${channel==='wiki'?'知识空间与父页面':'文件夹'}</option><option value="sales">销售团队 / ${channel==='wiki'?'操作规范':'培训资料'}</option></select>`)}${field(workmate?'分享范围':'可见范围',workmate?'<select><option>仅工作区成员</option><option>持有链接的工作区成员</option></select>':'<input readonly value="继承目标位置权限 · 选择位置后确认">',workmate?'使用者安装时自行确认依赖与权限。':'不自动扩大目标位置的访问权限。')}${field('发布方式','<select><option>新建发布</option><option disabled>更新已有发布 · 首次发布后可用</option></select>')}<label class="check"><input type="checkbox" checked><span>${workmate?'包含当前审核产物与脱敏资源':'附带文档中引用的 2 张脱敏截图'}</span></label><p class="muted" style="font-size:11px;margin:9px 0 18px 26px;line-height:1.8">不包含原始录屏、会话记录或账号凭据。</p>${workmate&&kind==='skill'?'<div class="notice" style="margin-bottom:16px">此技能尚未通过业务试运行，分享页将保留“执行未验证”标记。</div>':''}${sourceCheck('我已核对目标位置、可见范围及本次发布内容。')}</div>`}
function summary(){return `<aside class="card publish-summary"><h3>本次发布</h3><dl><dt>内容</dt><dd>${title()}</dd><dt>产物类型</dt><dd>${label()}</dd><dt>版本</dt><dd>修订 3 · 已审核</dd><dt>资源</dt><dd>正文与 2 张脱敏截图</dd><dt>使用方式</dt><dd>${channel==='workmate'?(kind==='skill'?'打开分享页，安装到 Workmate':'安装文档资源，随时查阅'):'打开链接查看文档'}</dd></dl><div class="mini-preview"><b>${title()}</b><span></span><span></span><span style="width:65%"></span></div></aside>`}
function publish(){return heading('发布与分享','让这份成果被使用','选择一个去处，将已审核的版本发布给需要的人。',button('返回生成','review'))+`<main class="body"><div class="publish-grid"><div><h2>发布到哪里</h2><div class="channels">${channelRow('feishu','飞','飞书文档','发布到团队文件夹，通过链接查看')}${channelRow('wiki','W','Wiki 知识库','归档到知识空间，便于长期查阅')}${channelRow('workmate','M','Workmate 分享链接',kind==='skill'?'安装可复用技能，使用者自行授权':'分享可安装的文档资源，供查阅与学习')}</div>${destination()}</div>${summary()}<details class="summary-mobile"><summary>查看本次发布内容</summary>${summary()}</details></div></main>`+foot('发布后可复制链接，不会自动通知其他人。',button('先导出文件','export')+button(channel==='workmate'?'生成安装分享链接':'发布到'+(channel==='wiki'?'知识库':'飞书文档'),'publish-now',true,!confirmed||state==='disconnected'))}
function success(){const stale=state==='stale',where=channel==='workmate'?'Workmate':channel==='wiki'?'团队知识库':'飞书文档';return heading('发布与分享',stale?'已有发布需要更新':'已发布，可以分享了',stale?'当前已审核修订 4；远端仍为修订 3，不会自动覆盖。':'已确认远端内容，链接指向本次发布的版本。')+`<main class="body"><section class="result"><div class="result-icon">✓</div><h2>${title()}</h2><p>${where} · ${stale?'已发布修订 3':'已发布修订 3'} · ${channel==='workmate'?'仅工作区成员可访问':'继承目标目录权限'}</p><div class="card"><div class="card-head"><h3>${channel==='workmate'?'安装分享链接':'文档链接'}</h3><span class="badge good">发布成功</span></div><div class="url"><input aria-label="示例分享链接" readonly value="https://share.example.invalid/${channel}/quote-r3">${button('复制链接','copy')}</div><div class="result-actions">${button('打开'+(channel==='workmate'?'分享页':'文档'),'open')}${button('发布到其他位置','publish')}${channel==='workmate'?button('停用分享链接','revoke'):button('管理访问权限','permissions')}</div></div><section class="history"><h3>发布记录</h3><div class="row"><span>${where} / 销售团队<br><small class="muted">修订 3 · 今天 14:32 · 发布者：秦晓</small></span><span class="badge good">已发布</span></div></section></section></main>`+foot(stale?'更新前重新核对目标位置与权限。':'本地后续修改不会自动改变已发布版本。',button('返回生成','review')+(stale?button('审核更新内容并发布','update',true):button('完成','done',true)))}
function blocked(){const unknown=state==='unknown',failed=state==='failure';return heading('发布与分享',unknown?'发布结果待确认':failed?'发布未完成':'先完成内容审核',unknown?'连接中断，远端可能已经收到请求。':failed?'飞书授权已失效，本地文档与目标选择均已保留。':'这份文档尚未形成可发布的审核版本。')+`<main class="body"><section class="empty"><h2>${unknown?'正在核对是否已创建文档':failed?'重新连接后继续':'返回生成，核对内容并保存'}</h2><p>${unknown?'核对完成前不重复提交，避免产生两份文档。':failed?'重新连接不会自动发布，也不会重新生成文档。':'发布只使用审核后的固定版本；草稿仍可导出到本地。'}</p>${button(unknown?'核对远端结果':failed?'重新连接':'返回生成并审核',unknown?'success':failed?'connect':'review',true)}</section></main>`+foot('已有产物与发布记录会保留。',button('导出文件','export'))}
function render(){const pub=isPublish();const content=state==='choose'?chooser():state==='setup'||state==='manual'?setup():state==='generating'||state==='publishing'?busy(state==='publishing'):state==='outline'?outline():['review','draft','skill'].includes(state)?review():['success','stale'].includes(state)?success():['failure','blocked','unknown'].includes(state)?blocked():publish();$('#app').innerHTML=`<aside class="sidebar"><header><strong>录制记录</strong><span class="muted">＋</span></header><div class="record active"><small>今天 10:32</small><b>客户报价</b><small>4 分 32 秒 · ${state==='success'?'已发布':'已分析'}</small></div><div class="record"><small>昨天 16:20</small><b>整理客户资料</b><small>已保存</small></div><div class="record"><small>昨天 11:08</small><b>导出销售报表</b><small>已分析</small></div><div class="side-bottom">设置</div></aside><section class="workspace"><nav class="steps" aria-label="录制产物制作流程"><button data-action="earlier">1 原始素材确认</button><span class="arrow">→</span><button data-action="earlier">2 深度分析</button><span class="arrow">→</span><button data-action="choose" class="${!pub?'active':''}" ${!pub?'aria-current="step"':''}>3 生成 <small>${pub?'已审核':'待确认'}</small></button><span class="arrow">→</span><button data-action="publish-nav" class="${pub?'active':''}" ${pub?'aria-current="step"':''}>4 发布 <small>${state==='success'?'已发布':'待发布'}</small></button></nav><label class="context" ${state==='choose'?'hidden style="display:none"':''}>本次产物<select id="output"><option value="sop" ${kind==='sop'?'selected':''}>SOP 操作说明</option><option value="manual" ${kind==='manual'?'selected':''}>使用手册</option><option value="skill" ${kind==='skill'?'selected':''}>通用 Skill</option></select></label>${content}</section>`;$('#scenario').value=state;$('#notes').innerHTML=(notes[state]||notes.publish).map(n=>`<li>${n}</li>`).join('');$('#output').onchange=e=>{kind=e.target.value;approved=false;state=kind==='manual'?'manual':kind==='skill'?'skill':'setup';confirmed=false;location.hash=state;render()};const check=$('#confirm');if(check)check.onchange=e=>{confirmed=e.target.checked;updateCTA()};const dest=$('#destination');if(dest)dest.onchange=()=>{const perm=[...document.querySelectorAll('input[readonly]')].find(i=>i.value.startsWith('继承'));if(perm)perm.value=dest.value?'销售团队成员 · 继承目标位置权限':'继承目标位置权限 · 选择位置后确认';updateCTA()}}
function updateCTA(){const btn=document.querySelector('[data-action="generate"], [data-action="to-publish"], [data-action="publish-now"]');if(!btn)return;btn.disabled=!confirmed||state==='draft'||state==='disconnected'||(isPublish()&&channel!=='workmate'&&!$('#destination')?.value)}
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,2400)}
document.addEventListener('click',e=>{const c=e.target.closest('[data-channel]');if(c){channel=c.dataset.channel;confirmed=false;render();return}const a=e.target.closest('[data-action]');if(!a)return;const action=a.dataset.action;if(action==='generate')go('generating');else if(action==='body'){go('review');kind='manual';render()}else if(action==='to-publish'){approved=true;go('publish')}else if(action==='publish-now')go('publishing');else if(action==='publish-nav')go(approved?'publish':'blocked');else if(action==='copy'){toast('演示：已复制示例链接')}else if(action==='export')toast('设计演示：产品中将打开文件保存对话框');else if(action==='connect'){state=channel==='wiki'?'wiki':channel==='workmate'?'workmate':'publish';render();toast('演示：已连接，请选择目标并确认发布')}else if(action==='update'){state='publish';confirmed=false;render();toast('演示：更新已有发布前确认修订 4 的差异')}else if(['open','permissions','revoke','done','earlier'].includes(action))toast({open:'演示链接不会打开真实服务',permissions:'产品中将打开目标平台的权限管理页',revoke:'产品中需确认停用；已安装的副本不自动删除',done:'发布完成，返回记录列表',earlier:'前两阶段沿用 v11 设计，本稿聚焦生成与发布'}[action]);else go(action)});
$('#scenario').innerHTML=Object.entries(states).map(([id,name])=>`<option value="${id}">${name}</option>`).join('');$('#scenario').onchange=e=>go(e.target.value);
const initial=location.hash.slice(1);if(states[initial])go(initial);else render();
addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(states[next]&&next!==state)go(next)});
</script>
</body>
</html>
