ont-size="25" font-weight="600" fill="#292929">通用</text><text x="350" y="187" font-size="14" font-weight="400" fill="#777">统一查看配置概况；点击项目进入对应设置。</text><rect x="350" y="230" width="750" height="83" rx="8" fill="white" stroke="#ccc" /><text x="370" y="260" font-size="17" font-weight="600" fill="#292929">浏览器插件</text><text x="370" y="288" font-size="13" font-weight="400" fill="#777">Chrome 已连接 · Edge 未连接</text><a href="#31-browser" data-screen="31-browser"><rect x="950" y="254" width="130" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="964" y="279" font-size="14" font-weight="400" fill="#292929">查看设置</text></a><rect x="350" y="328" width="750" height="83" rx="8" fill="white" stroke="#ccc" /><text x="370" y="358" font-size="17" font-weight="600" fill="#292929">AI 模型</text><text x="370" y="386" font-size="13" font-weight="400" fill="#777">API 已保存 · 作为后备</text><a href="#05-api-fallback" data-screen="05-api-fallback"><rect x="950" y="352" width="130" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="964" y="377" font-size="14" font-weight="400" fill="#292929">查看设置</text></a><rect x="350" y="426" width="750" height="83" rx="8" fill="white" stroke="#ccc" /><text x="370" y="456" font-size="17" font-weight="600" fill="#292929">Agent 能力</text><text x="370" y="484" font-size="13" font-weight="400" fill="#777">Claude Code 已就绪 · 专用环境</text><a href="#02-settings" data-screen="02-settings"><rect x="950" y="450" width="130" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="964" y="475" font-size="14" font-weight="400" fill="#292929">查看设置</text></a><rect x="350" y="524" width="750" height="83" rx="8" fill="white" stroke="#ccc" /><text x="370" y="554" font-size="17" font-weight="600" fill="#292929">语音与隐私</text><text x="370" y="582" font-size="13" font-weight="400" fill="#777">SenseVoice 本地就绪 · 隐私保护开启</text><a href="#32-capture-settings" data-screen="32-capture-settings"><rect x="950" y="548" width="130" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="964" y="573" font-size="14" font-weight="400" fill="#292929">查看设置</text></a><a href="#37-privacy-settings" data-screen="37-privacy-settings"><text x="86" y="494" font-size="16" font-weight="400" fill="#292929">隐私保护</text></a><rect x="350" y="622" width="750" height="83" rx="8" fill="white" stroke="#ccc" /><text x="370" y="652" font-size="17" font-weight="600" fill="#292929">异常诊断</text><text x="370" y="680" font-size="13" font-weight="400" fill="#777">按失败来源定位并查看脱敏诊断信息</text><a href="#26-connection-error" data-screen="26-connection-error"><rect x="950" y="646" width="130" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="964" y="671" font-size="14" font-weight="400" fill="#292929">查看设置</text></a><text x="350" y="772" font-size="14" font-weight="400" fill="#777">配置按分组显式保存；只读检查与主动连接检查分开。</text></svg>