<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="960" rx="14" fill="#f7f7f7" stroke="#292929" /><rect x="0" y="0" width="1200" height="36" rx="0" fill="white" stroke="none" /><circle cx="18" cy="18" r="6" fill="#dddddd" /><circle cx="38" cy="18" r="6" fill="#dddddd" /><circle cx="58" cy="18" r="6" fill="#dddddd" /><text x="84" y="24" font-size="15" font-weight="600" fill="#787878" text-anchor="start">技能录制器</text><line x1="0" y1="36" x2="1200" y2="36" stroke="#cccccc" /><line x1="300" y1="36" x2="300" y2="960" stroke="#cccccc" /><text x="18" y="69" font-size="13" font-weight="400" fill="#787878" text-anchor="start">录制记录</text><rect x="94" y="49" width="32" height="28" rx="8" fill="#f7f7f7" stroke="none" /><text x="110.0" y="69" font-size="12" font-weight="400" fill="#787878" text-anchor="middle">17</text><rect x="12" y="87" width="274" height="88" rx="10" fill="#eeeeee" stroke="#292929" /><text x="24" y="111" font-size="12" font-weight="400" fill="#787878" text-anchor="start">10月13日 20:31</text><text x="225" y="111" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已分析</text><text x="24" y="136" font-size="15" font-weight="600" fill="#292929" text-anchor="start">发送订单报价单</text><text x="24" y="159" font-size="10" font-weight="400" fill="#787878" text-anchor="start">4分32秒  8.1 MB  5 steps  视频  旁白</text><rect x="12" y="185" width="274" height="88" rx="10" fill="white" stroke="#cccccc" /><text x="24" y="209" font-size="12" font-weight="400" fill="#787878" text-anchor="start">10月13日 20:29</text><text x="225" y="209" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已录制</text><text x="24" y="234" font-size="15" font-weight="600" fill="#292929" text-anchor="start">尚未分析</text><text x="24" y="257" font-size="10" font-weight="400" fill="#787878" text-anchor="start">27秒  872.7 KB  视频  旁白</text><rect x="12" y="283" width="274" height="88" rx="10" fill="white" stroke="#cccccc" /><text x="24" y="307" font-size="12" font-weight="400" fill="#787878" text-anchor="start">10月13日 11:18</text><text x="225" y="307" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已分析</text><text x="24" y="332" font-size="15" font-weight="600" fill="#292929" text-anchor="start">浏览百度热搜话题</text><text x="24" y="355" font-size="10" font-weight="400" fill="#787878" text-anchor="start">30秒  3.9 MB  4 steps  视频  旁白</text><rect x="12" y="381" width="274" height="88" rx="10" fill="white" stroke="#cccccc" /><text x="24" y="405" font-size="12" font-weight="400" fill="#787878" text-anchor="start">10月13日 11:05</text><text x="225" y="405" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已录制</text><text x="24" y="430" font-size="15" font-weight="600" fill="#292929" text-anchor="start">尚未分析</text><text x="24" y="453" font-size="10" font-weight="400" fill="#787878" text-anchor="start">42秒  2.2 MB  视频  旁白</text><rect x="12" y="479" width="274" height="88" rx="10" fill="white" stroke="#cccccc" /><text x="24" y="503" font-size="12" font-weight="400" fill="#787878" text-anchor="start">10月12日 21:23</text><text x="225" y="503" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已录制</text><text x="24" y="528" font-size="15" font-weight="600" fill="#292929" text-anchor="start">尚未分析</text><text x="24" y="551" font-size="10" font-weight="400" fill="#787878" text-anchor="start">11秒  776.4 KB  视频  旁白</text><rect x="12" y="577" width="274" height="88" rx="10" fill="white" stroke="#cccccc" /><text x="24" y="601" font-size="12" font-weight="400" fill="#787878" text-anchor="start">10月12日 21:22</text><text x="225" y="601" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已录制</text><text x="24" y="626" font-size="15" font-weight="600" fill="#292929" text-anchor="start">尚未分析</text><text x="24" y="649" font-size="10" font-weight="400" fill="#787878" text-anchor="start">39秒  1.7 MB  视频  旁白</text><rect x="12" y="675" width="274" height="88" rx="10" fill="white" stroke="#cccccc" /><text x="24" y="699" font-size="12" font-weight="400" fill="#787878" text-anchor="start">10月12日 21:06</text><text x="225" y="699" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已分析</text><text x="24" y="724" font-size="15" font-weight="600" fill="#292929" text-anchor="start">整理工作簿</text><text x="24" y="747" font-size="10" font-weight="400" fill="#787878" text-anchor="start">16秒  966.9 KB  3 steps  视频  旁白</text><rect x="12" y="773" width="274" height="88" rx="10" fill="white" stroke="#cccccc" /><text x="24" y="797" font-size="12" font-weight="400" fill="#787878" text-anchor="start">10月10日 13:24</text><text x="225" y="797" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已分析</text><text x="24" y="822" font-size="15" font-weight="600" fill="#292929" text-anchor="start">导出订单报表</text><text x="24" y="845" font-size="10" font-weight="400" fill="#787878" text-anchor="start">1分23秒  3.5 MB  6 steps  视频</text><rect x="290" y="90" width="5" height="510" rx="3" fill="#cccccc" stroke="none" /><text x="332" y="77" font-size="14" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">澄清和补充</text><text x="470" y="77" font-size="14" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">10月13日 20:31</text><a href="#08-analysis" data-screen="08-analysis" aria-label="返回分析" transform="translate(0,60) "><rect x="1092" y="52" width="84" height="38" rx="10" fill="#f7f7f7" stroke="#cccccc" /><text x="1134.0" y="76.0" font-size="14" font-weight="400" fill="#292929" text-anchor="middle">返回分析</text></a><line x1="300" y1="100" x2="1200" y2="100" stroke="#cccccc" transform="translate(0,60) " /><text x="348" y="145" font-size="22" font-weight="600" fill="#292929" text-anchor="start" transform="translate(0,60) ">审核补充结果</text><text x="348" y="176" font-size="14" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">历史事实和业务规则已补充；请逐项审核，不固化当前查询值。</text><rect x="348" y="203" width="804" height="326" rx="12" fill="white" stroke="#cccccc" transform="translate(0,60) " /><text x="370" y="239" font-size="18" font-weight="600" fill="#292929" text-anchor="start" transform="translate(0,60) ">1  附件与订单的对应关系</text><rect x="902" y="218" width="226" height="28" rx="8" fill="#f7f7f7" stroke="none" transform="translate(0,60) " /><text x="1015.0" y="238" font-size="12" font-weight="400" fill="#787878" text-anchor="middle" transform="translate(0,60) ">人工补充证据 · 录制时</text><text x="370" y="284" font-size="13" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">原分析</text><text x="370" y="315" font-size="15" font-weight="400" fill="#292929" text-anchor="start" transform="translate(0,60) ">下载了报价附件，但无法确认它对应哪个订单。</text><text x="370" y="361" font-size="13" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">补充证据</text><text x="370" y="392" font-size="15" font-weight="400" fill="#292929" text-anchor="start" transform="translate(0,60) ">用户导入的订单记录与邮件材料标识一致；仍需审核其可信性。</text><rect x="370" y="421" width="174" height="38" rx="10" fill="#f7f7f7" stroke="#cccccc" transform="translate(0,60) " /><text x="457.0" y="445.0" font-size="14" font-weight="400" fill="#292929" text-anchor="middle" transform="translate(0,60) ">查看订单附件证据</text><rect x="560" y="421" width="174" height="38" rx="10" fill="#f7f7f7" stroke="#cccccc" transform="translate(0,60) " /><text x="647.0" y="445.0" font-size="14" font-weight="400" fill="#292929" text-anchor="middle" transform="translate(0,60) ">查看历史邮件证据</text><rect x="370" y="488" width="15" height="15" rx="3" fill="white" stroke="#292929" transform="translate(0,60) " /><text x="377.5" y="500" font-size="13" font-weight="400" fill="#292929" text-anchor="middle" transform="translate(0,60) ">✓</text><text x="396" y="501" font-size="14" font-weight="400" fill="#292929" text-anchor="start" transform="translate(0,60) ">接受这条修订</text><text x="1008" y="501" font-size="14" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">修改 / 拒绝</text><rect x="348" y="546" width="804" height="122" rx="12" fill="white" stroke="#cccccc" transform="translate(0,60) " /><text x="370" y="583" font-size="17" font-weight="600" fill="#292929" text-anchor="start" transform="translate(0,60) ">2  以后按订单号处理一条</text><rect x="902" y="562" width="226" height="28" rx="8" fill="#f7f7f7" stroke="none" transform="translate(0,60) " /><text x="1015.0" y="582" font-size="12" font-weight="400" fill="#787878" text-anchor="middle" transform="translate(0,60) ">用户确认 · 适用规则</text><text x="370" y="617" font-size="14" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">适用于用户明确提供订单号的报价发送任务。</text><text x="370" y="645" font-size="13" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">同时保留：仅已支付订单；发送前确认正文和附件。</text><text x="1017" y="642" font-size="14" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">展开审核</text><rect x="348" y="683" width="804" height="115" rx="12" fill="white" stroke="#cccccc" transform="translate(0,60) " /><text x="370" y="720" font-size="17" font-weight="600" fill="#292929" text-anchor="start" transform="translate(0,60) ">3  当前联系人邮箱</text><rect x="902" y="699" width="226" height="28" rx="8" fill="#f7f7f7" stroke="none" transform="translate(0,60) " /><text x="1015.0" y="719" font-size="12" font-weight="400" fill="#787878" text-anchor="middle" transform="translate(0,60) ">当前值 · 运行时查询</text><text x="370" y="755" font-size="14" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">只能描述如何重新查询，不能写成固定收件人。</text><rect x="1187" y="184" width="5" height="374" rx="3" fill="#cccccc" stroke="none" transform="translate(0,60) " /><rect x="301" y="840" width="898" height="59" rx="0" fill="#f7f7f7" stroke="none" transform="translate(0,60) " /><line x1="300" y1="840" x2="1200" y2="840" stroke="#cccccc" transform="translate(0,60) " /><text x="332" y="874" font-size="12" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">事实与规则审核通过后，再进入生成阶段。</text><a href="#22-generation-ready" data-screen="22-generation-ready" aria-label="确认并进入生成" transform="translate(0,60) "><rect x="1000" y="853" width="176" height="38" rx="10" fill="#292929" stroke="none" /><text x="1088.0" y="877.0" font-size="14" font-weight="600" fill="white" text-anchor="middle">确认并进入生成</text></a><a href="#23-generation-pending" data-screen="23-generation-pending" aria-label="保存待确认草稿" transform="translate(0,60) "><rect x="822" y="853" width="162" height="38" rx="10" fill="#f7f7f7" stroke="#cccccc" /><text x="903.0" y="877.0" font-size="14" font-weight="400" fill="#292929" text-anchor="middle">保存待确认草稿</text></a><rect x="301" y="36" width="898" height="60" rx="0" fill="white" stroke="none" /><a href="#08-analysis" data-screen="08-analysis"><text x="332" y="64" font-size="17" font-weight="400" fill="#787878" text-anchor="start">分析</text><text x="375" y="64" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已分析</text></a><text x="477" y="65" font-size="18" font-weight="400" fill="#787878" text-anchor="start">›</text><a href="#12-facts" data-screen="12-facts"><text x="510" y="64" font-size="17" font-weight="600" fill="#292929" text-anchor="start">澄清和补充</text><text x="610" y="64" font-size="11" font-weight="400" fill="#787878" text-anchor="start">待审核</text><line x1="510" y1="87" x2="636" y2="87" stroke="#292929" /></a><text x="655" y="65" font-size="18" font-weight="400" fill="#787878" text-anchor="start">›</text><a href="#23-generation-pending" data-screen="23-generation-pending"><text x="688" y="64" font-size="17" font-weight="400" fill="#787878" text-anchor="start">生成</text><text x="731" y="64" font-size="11" font-weight="400" fill="#787878" text-anchor="start">待生成</text></a><text x="1159" y="65" font-size="12" font-weight="400" fill="#787878" text-anchor="end">同一条录制</text><line x1="300" y1="96" x2="1200" y2="96" stroke="#cccccc" /></svg>