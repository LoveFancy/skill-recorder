ht="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">回答 v2 已保存；旧增强仍基于回答 v1，旧 Skill 保留供参考。</text><rect x="348" y="204" width="804" height="192" rx="12" fill="white" stroke="#cccccc" transform="translate(0,60) " /><text x="370" y="241" font-size="18" font-weight="600" fill="#292929" text-anchor="start" transform="translate(0,60) ">发生了什么变化</text><text x="370" y="281" font-size="15" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">处理范围由单条订单改为满足条件的一组订单。</text><text x="370" y="314" font-size="15" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">受影响：集合筛选、终止条件、对应联系人与附件规则。</text><text x="370" y="347" font-size="15" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">旧增强 v1 / Skill v1 不会被自动覆盖或当作最新成果。</text><rect x="348" y="427" width="804" height="136" rx="12" fill="white" stroke="#cccccc" transform="translate(0,60) " /><text x="370" y="464" font-size="18" font-weight="600" fill="#292929" text-anchor="start" transform="translate(0,60) ">下一步</text><text x="370" y="508" font-size="15" font-weight="400" fill="#292929" text-anchor="start" transform="translate(0,60) ">确认新版补充内容，再增强并审核受影响的内容。</text><rect x="370" y="600" width="224" height="38" rx="10" fill="#f7f7f7" stroke="#cccccc" transform="translate(0,60) " /><text x="482.0" y="624.0" font-size="14" font-weight="400" fill="#292929" text-anchor="middle" transform="translate(0,60) ">查看上一版导出文件</text><a href="#11-question" data-screen="11-question" transform="translate(0,60) "><text x="348" y="707" font-size="14" font-weight="400" fill="#787878" text-anchor="start">返回修改回答</text></a><rect x="301" y="840" width="898" height="59" rx="0" fill="#f7f7f7" stroke="none" transform="translate(0,60) " /><line x1="300" y1="840" x2="1200" y2="840" stroke="#cccccc" transform="translate(0,60) " /><text x="332" y="874" font-size="12" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">生成入口暂不可用；上一有效版本仍保留。</text><rect x="1000" y="853" width="176" height="38" rx="10" fill="#f7f7f7" stroke="#cccccc" transform="translate(0,60) " /><text x="1088.0" y="877.0" font-size="14" font-weight="400" fill="#787878" text-anchor="middle" transform="translate(0,60) ">生成新版 Skill</text><a href="#21-task-package" data-screen="21-task-package" aria-label="确认新版补充内容" transform="translate(0,60) "><rect x="822" y="853" width="162" height="38" rx="10" fill="#f7f7f7" stroke="#cccccc" /><text x="903.0" y="877.0" font-size="14" font-weight="400" fill="#292929" text-anchor="middle">确认新版补充内容</text></a><rect x="301" y="36" width="898" height="60" rx="0" fill="white" stroke="none" /><a href="#08-analysis" data-screen="08-analysis"><text x="332" y="64" font-size="17" font-weight="400" fill="#787878" text-anchor="start">分析</text><text x="375" y="64" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已分析</text></a><text x="477" y="65" font-size="18" font-weight="400" fill="#787878" text-anchor="start">›</text><a href="#11-question" data-screen="11-question"><text x="510" y="64" font-size="17" font-weight="400" fill="#787878" text-anchor="start">澄清和补充</text><text x="610" y="64" font-size="11" font-weight="400" fill="#787878" text-anchor="start">需更新</text></a><text x="655" y="65" font-size="18" font-weight="400" fill="#787878" text-anchor="start">›</text><a href="#24-generation-stale" data-screen="24-generation-stale"><text x="688" y="64" font-size="17" font-weight="600" fill="#292929" text-anchor="start">生成</text><text x="731" y="64" font-size="11" font-weight="400" fill="#787878" text-anchor="start">需更新</text><line x1="688" y1="87" x2="814" y2="87" stroke="#292929" /></a><text x="1159" y="65" font-size="12" font-weight="400" fill="#787878" text-anchor="end">同一条录制</text><line x1="300" y1="96" x2="1200" y2="96" stroke="#cccccc" /></svg>