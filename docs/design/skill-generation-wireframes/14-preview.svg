 text-anchor="start">39秒  1.7 MB  视频  旁白</text><rect x="12" y="675" width="274" height="88" rx="10" fill="white" stroke="#cccccc" /><text x="24" y="699" font-size="12" font-weight="400" fill="#787878" text-anchor="start">10月12日 21:06</text><text x="225" y="699" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已分析</text><text x="24" y="724" font-size="15" font-weight="600" fill="#292929" text-anchor="start">整理工作簿</text><text x="24" y="747" font-size="10" font-weight="400" fill="#787878" text-anchor="start">16秒  966.9 KB  3 steps  视频  旁白</text><rect x="12" y="773" width="274" height="88" rx="10" fill="white" stroke="#cccccc" /><text x="24" y="797" font-size="12" font-weight="400" fill="#787878" text-anchor="start">10月10日 13:24</text><text x="225" y="797" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已分析</text><text x="24" y="822" font-size="15" font-weight="600" fill="#292929" text-anchor="start">导出订单报表</text><text x="24" y="845" font-size="10" font-weight="400" fill="#787878" text-anchor="start">1分23秒  3.5 MB  6 steps  视频</text><rect x="290" y="90" width="5" height="510" rx="3" fill="#cccccc" stroke="none" /><text x="332" y="77" font-size="14" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">创建</text><text x="470" y="77" font-size="14" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">10月13日 20:31</text><a href="#08-analysis" data-screen="08-analysis" aria-label="返回分析" transform="translate(0,60) "><rect x="1092" y="52" width="84" height="38" rx="10" fill="#f7f7f7" stroke="#cccccc" /><text x="1134.0" y="76.0" font-size="14" font-weight="400" fill="#292929" text-anchor="middle">返回分析</text></a><line x1="300" y1="100" x2="1200" y2="100" stroke="#cccccc" transform="translate(0,60) " /><text x="348" y="145" font-size="22" font-weight="600" fill="#292929" text-anchor="start" transform="translate(0,60) ">发送订单报价单</text><text x="348" y="176" font-size="14" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">技能计划已保存。</text><rect x="302" y="101" width="897" height="798" rx="0" fill="#eeeeee" stroke="none" transform="translate(0,60) " /><rect x="370" y="143" width="742" height="666" rx="14" fill="white" stroke="#292929" transform="translate(0,60) " /><text x="394" y="187" font-size="22" font-weight="600" fill="#292929" text-anchor="start" transform="translate(0,60) ">查看 SKILL.md</text><a href="#13-plan" data-screen="13-plan" aria-label="关闭" transform="translate(0,60) "><rect x="1016" y="158" width="72" height="38" rx="10" fill="#f7f7f7" stroke="#cccccc" /><text x="1052.0" y="182.0" font-size="14" font-weight="400" fill="#292929" text-anchor="middle">关闭</text></a><text x="394" y="225" font-size="13" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">只读文件预览，包含元数据。选择下方操作后才会导出。</text><text x="394" y="252" font-size="13" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">关闭保留预览，修改计划将重新生成。</text><rect x="394" y="280" width="694" height="383" rx="8" fill="#f7f7f7" stroke="#cccccc" transform="translate(0,60) " /><text x="414" y="313" font-size="14" font-weight="400" fill="#292929" text-anchor="start" transform="translate(0,60) ">---</text><text x="414" y="340" font-size="14" font-weight="400" fill="#292929" text-anchor="start" transform="translate(0,60) ">name: send-order-quote</text><text x="414" y="367" font-size="14" font-weight="400" fill="#292929" text-anchor="start" transform="translate(0,60) ">description: 按订单号整理并发送报价单</text><text x="414" y="394" font-size="14" font-weight="400" fill="#292929" text-anchor="start" transform="translate(0,60) ">---</text><text x="414" y="421" font-size="14" font-weight="400" fill="#292929" text-anchor="start" transform="translate(0,60) " /><text x="414" y="448" font-size="14" font-weight="400" fill="#292929" text-anchor="start" transform="translate(0,60) ">输入：订单号；缺失时先询问用户。</text><text x="414" y="475" font-size="14" font-weight="400" fill="#292929" text-anchor="start" transform="translate(0,60) ">前提：已配置业务系统和邮箱连接器。</text><text x="414" y="502" font-size="14" font-weight="400" fill="#292929" text-anchor="start" transform="translate(0,60) " /><text x="414" y="529" font-size="14" font-weight="400" fill="#292929" text-anchor="start" transform="translate(0,60) ">1. 查询订单，核对订单号且状态为已支付。</text><text x="414" y="556" font-size="14" font-weight="400" fill="#292929" text-anchor="start" transform="translate(0,60) ">2. 获取当前联系人邮箱和对应报价附件。</text><text x="414" y="583" font-size="14" font-weight="400" fill="#292929" text-anchor="start" transform="translate(0,60) ">3. 核对附件，准备邮件并请求用户确认。</text><text x="414" y="610" font-size="14" font-weight="400" fill="#292929" text-anchor="start" transform="translate(0,60) ">4. 确认后发送，核对已发送结果。</text><text x="394" y="701" font-size="13" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">✓ 内容与计划一致   ✓ 依赖已核验   ✓ 未发现凭据</text><text x="394" y="732" font-size="13" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">本次只审核内容，尚未进行实际任务运行验证。</text><a href="#15-exported" data-screen="15-exported" aria-label="选择位置并导出技能" transform="translate(0,60) "><rect x="828" y="755" width="260" height="38" rx="10" fill="#292929" stroke="none" /><text x="958.0" y="779.0" font-size="14" font-weight="600" fill="white" text-anchor="middle">选择位置并导出技能</text></a><rect x="301" y="36" width="898" height="60" rx="0" fill="white" stroke="none" /><a href="#08-analysis" data-screen="08-analysis"><text x="332" y="64" font-size="17" font-weight="400" fill="#787878" text-anchor="start">分析</text><text x="375" y="64" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已分析</text></a><text x="477" y="65" font-size="18" font-weight="400" fill="#787878" text-anchor="start">›</text><a href="#12-facts" data-screen="12-facts"><text x="510" y="64" font-size="17" font-weight="400" fill="#787878" text-anchor="start">澄清和补充</text><text x="610" y="64" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已审核</text></a><text x="655" y="65" font-size="18" font-weight="400" fill="#787878" text-anchor="start">›</text><a href="#14-preview" data-screen="14-preview"><text x="688" y="64" font-size="17" font-weight="600" fill="#292929" text-anchor="start">生成</text><text x="731" y="64" font-size="11" font-weight="400" fill="#787878" text-anchor="start">草稿</text><line x1="688" y1="87" x2="814" y2="87" stroke="#292929" /></a><text x="1159" y="65" font-size="12" font-weight="400" fill="#787878" text-anchor="end">同一条录制</text><line x1="300" y1="96" x2="1200" y2="96" stroke="#cccccc" /></svg>