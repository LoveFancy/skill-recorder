ze=\"14\" font-weight=\"400\" fill=\"#777\">已保存 ≠ 连接检查通过。密钥保持遮挡，不展示在诊断中。</text><rect x=\"350\" y=\"675\" width=\"130\" height=\"38\" rx=\"8\" fill=\"#f4f4f4\" stroke=\"#ccc\" /><text x=\"364\" y=\"700\" font-size=\"14\" font-weight=\"400\" fill=\"#292929\">检查连接</text><rect x=\"948\" y=\"675\" width=\"152\" height=\"38\" rx=\"8\" fill=\"#f4f4f4\" stroke=\"#ccc\" /><text x=\"962\" y=\"700\" font-size=\"14\" font-weight=\"400\" fill=\"#292929\">保存模型配置</text><text x=\"350\" y=\"756\" font-size=\"14\" font-weight=\"400\" fill=\"#777\">本地 Agent 需登录或环境不可用时，提示修复，不静默切换 API。</text></svg>", "notes": ["不再要求选择或信任用户项目目录。", "环境及能力开关更改不会自动启动增强；任务仍有独立范围确认。"]}, {"id": "02-settings", "title": "Agent 能力 · 自动管理 Claude 专用环境", "group": "08 全局设置与能力管理", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1200\" height=\"900\" viewBox=\"0 0 1200 900\" font-family=\"PingFang SC,Microsoft YaHei,sans-serif\"><rect x=\"0\" y=\"0\" width=\"1200\" height=\"900\" rx=\"0\" fill=\"#f2f2f2\" stroke=\"#ccc\" /><text x=\"30\" y=\"30\" font-size=\"13\" font-weight=\"400\" fill=\"#777\">技能录制器 · 原窗口保留在后方</text><rect x=\"48\" y=\"54\" width=\"1104\" height=\"798\" rx=\"14\" fill=\"white\" stroke=\"#ccc\" /><rect x=\"48\" y=\"54\" width=\"252\" height=\"798\" rx=\"14\" fill=\"#f7f7f7\" stroke=\"#ccc\" /><text x=\"78\" y=\"99\" font-size=\"24\" font-weight=\"600\" fill=\"#292929\">设置</text><a href=\"#01-home\" data-screen=\"01-home\"><text x=\"1110\" y=\"98\" font-size=\"26\" font-weight=\"400\" fill=\"#292929\">×</text></a><a href=\"#01-home\" data-screen=\"01-home\"><text x=\"78\" y=\"148\" font-size=\"16\" font-weight=\"400\" fill=\"#292929\">‹ 返回应用</text></a><a href=\"#30-general\" data-screen=\"30-general\"><text x=\"86\" y=\"209\" font-size=\"16\" font-weight=\"400\" fill=\"#292929\">通用</text></a><a href=\"#31-browser\" data-screen=\"31-browser\"><text x=\"86\" y=\"266\" font-size=\"16\" font-weight=\"400\" fill=\"#292929\">浏览器插件</text></a><a href=\"#05-api-fallback\" data-screen=\"05-api-fallback ght=\"125\" rx=\"8\" fill=\"#f7f7f7\" stroke=\"#ccc\" /><text x=\"370\" y=\"443\" font-size=\"18\" font-weight=\"600\" fill=\"#292929\">Skill Recorder 专用环境</text><text x=\"370\" y=\"474\" font-size=\"14\" font-weight=\"400\" fill=\"#292929\">✓ 已自动创建 · 配置版本 v3 · 全局来源同步于 16:50</text><text x=\"370\" y=\"504\" font-size=\"13\" font-weight=\"400\" fill=\"#777\">仅加载本应用启用的能力；不修改你的全局 Claude 配置。</text><text x=\"350\" y=\"579\" font-size=\"15\" font-weight=\"400\" fill=\"#292929\">已发现 2 个 MCP、2 个 Skills  ·  已启用 1 个 MCP、1 个 Skill</text><a href=\"#04-capabilities\" data-screen=\"04-capabilities\"><rect x=\"350\" y=\"605\" width=\"174\" height=\"38\" rx=\"8\" fill=\"#f4f4f4\" stroke=\"#ccc\" /><text x=\"364\" y=\"630\" font-size=\"14\" font-weight=\"400\" fill=\"#292929\">管理启用能力</text></a><a href=\"#35-global-sync\" data-screen=\"35-global-sync\"><rect x=\"542\" y=\"605\" width=\"174\" height=\"38\" rx=\"8\" fill=\"#f4f4f4\" stroke=\"#ccc\" /><text x=\"556\" y=\"630\" font-size=\"14\" font-weight=\"400\" fill=\"#292929\">同步全局配置</text></a><a href=\"#03-workspace\" data-screen=\"03-workspace\"><rect x=\"734\" y=\"605\" width=\"174\" height=\"38\" rx=\"8\" fill=\"#f4f4f4\" stroke=\"#ccc\" /><text x=\"748\" y=\"630\" font-size=\"14\" font-weight=\"400\" fill=\"#292929\">查看环境说明</text></a><text x=\"350\" y=\"701\" font-size=\"14\" font-weight=\"400\" fill=\"#777\">全局配置中新增的能力默认关闭，已有选择保留。</text><text x=\"350\" y=\"731\" font-size=\"13\" font-weight=\"400\" fill=\"#777\">只读取已核验的用户级来源；不扫描其他项目，不自动继承 hooks。</text><text x=\"350\" y=\"794\" font-size=\"13\" font-weight=\"400\" fill=\"#777\">已保存 · 启用能力会形成任务配置快照</text><a href=\"#33-enhancement-ready\" data-screen=\"33-enhancement-ready\"><rect x=\"946\" y=\"778\" width=\"154\" height=\"38\" rx=\"8\" fill=\"#f4f4f4\" stroke=\"#ccc\" /><text x=\"960\" y=\"803\" font-size=\"14\" font-weight=\"400\" fill=\"#292929\">完成并返回</text></a></svg>", "notes": ["取消默认项目下拉框及关联/创建目录按钮。", "检测与自动环境创建不加载业务 MCP；管理页选择并保存后才生成启用配置。", "界面“已启用”需有实际加载隔离依据，不能只靠提示词或 UI 开关。"]}, {"id": "03-workspace", "title": "Agent 能力 · 专用环境来源与边界", "group": "08 全局设置与能力管理", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1200\" height=\"900\" viewBox=\"0 0 1200 900\" font-family=\"PingFang SC,Microsoft YaHei,sans-serif\"><rect x=\"0\" y=\"0\" width=\"1200\" height=\"900\" rx=\"0\" fill=\"#f2f2f2\" stroke=\"#ccc\" /><text x=\"30\" y=\"30\" font-size=\"13\" font-weight=\"400\" fill=\"#777\">技能录制器 · 原窗口保留在后方</text><rect x=\"48\" y=\"54\" width=\"1104\" height=\"798\" rx=\"14\" fill=\"white\" stroke=\"#ccc\" /><rect x=\"48\" y=\"54\" width=\"252\" height=\"798\" rx=\"14\" fill=\"#f7f7f7\" stroke=\"#ccc\" /><text x=\"78\" y=\"99\" font-size=\"24\" font-weight=\"600\" fill=\"#292929\">设置</text><a href=\"#01-home\" data-screen=\"01-home\"><text x=\"1110\" y=\"98\" font-size=\"26\" font-weight=\"400\" fill=\"#292929\">×</text></a><a href=\"#01-home\" data-screen=\"01-home\"><text x=\"78\" y=\"148\" font-size=\"16\" font-weight=\"400\" fill=\"#292929\">‹ 返回应用</text></a><a href=\"#30-general\" data-screen=\"30-general\"><text x=\"86\" y=\"209\" font-size=\"16\" font-weight=\"400\" fill=\"#292929\">通用</text></a><a href=\"#31-browser\" data-screen=\"31-browser\"><text x=\"86\" y=\"266\" font-size=\"16\" font-weight=\"400\" fill=\"#292929\">浏览器插件</text></a><a href=\"#05-api-fallback\" data-screen=\"05-api-fallback\"><text x=\"86\" y=\"323\" font-size=\"16\" font-weight=\"400\" fill=\"#292929\">AI 模型</text></a><a href=\"#02-settings\" data-screen=\"02-settings\"><rect x=\"66\" y=\"352\" width=\"216\" height=\"44\" rx=\"8\" fill=\"#e8e8e8\" stroke=\"#ccc\" /><text x=\"86\" y=\"380\" font-size=\"16\" font-weight=\"600\" fill=\"#292929\">Agent 能力</text></a><a href=\"#32-capture-settings\" data-screen=\"32-capture-settings\"><text x=\"86\" y=\"437\" font-size=\"16\" font-weight=\"400\" fill=\"#292929\">语音转写</text></a><a href=\"#37-privacy-settings\" data-screen=\"37-privacy-settings\"><text x=\"86\" y=\"494\" font-size=\"16\" font-weight=\"400\" fill=\"#292929\">隐私保护</text></a><text x=\"78\" y=\"787\" font-size=\"12\" font-weight=\"400\" fill=\"#777\">所有页面共用这些配置</text><text x=\"78\" y=\"810\" font-size=\"12\" font-weight=\"400\" fill=\"#777\">不会自动修改当前运行任务</text><text x=\"338\" y=\"98\" font-size=\"14\" font-weight=\"400\" fill=\"#777\">设置  /  Agent 能力</text><text x=\"350\" y=\"155\" font-size=\"25\" font-weight=\"600\" fill=\"#292929\">专用环境说明</text><text x=\"350\" y=\"187\" font-size=\"14\" font-weight=\"400\" fill=\"#777\">无需用户创建或关联项目；此页仅说明来源、存储与隔离边界。</text><a href=\"#02-settings\" data-screen=\"02-settings\"><rect x=\"350\" y=\"215\" width=\"150\" height=\"38\" rx=\"8\" fill=\"#f4f4f4\" stroke=\"#ccc\" /><text x=\"364\" y=\"240\" font-size=\"14\" font-weight=\"400\" fill=\"#292929\">‹ 返回环境</text></a><text x=\"350\" y=\"297\" font-size=\"19\" font-weight=\"600\" fill=\"#292929\">1. 读取全局来源</text><text x=\"350\" y=\"330\" font-size=\"14\" font-weight=\"400\" fill=\"#292929\">读取已核验的用户级 MCP 配置与全局 Skills；保留来源和同步时间。</text><text x=\"350\" y=\"364\" font-size=\"13\" font-weight=\"400\" fill=\"#777\">不扫描其他项目；不把全局 CLAUDE.md、hooks 或宽泛权限整份复制。</text><text x=\"350\" y=\"430\" font-size=\"19\" font-weight=\"600\" fill=\"#292929\">2. 生成应用专用配置</text><text x=\"350\" y=\"463\" font-size=\"14\" font-weight=\"400\" fill=\"#292929\">保存你选择的 MCP / Skills；环境由应用自动创建和管理。</text><text x=\"350\" y=\"497\" font-size=\"13\" font-weight=\"400\" fill=\"#777\">复用现有 Claude 登录；尽量引用凭据，避免复制令牌或在界面展示密钥。</text><text x=\"350\" y=\"562\" font-size=\"19\" font-weight=\"600\" fill=\"#292929\">3. 每次任务固定版本</text><text x=\"350\" y=\"595\" font-size=\"14\" font-weight=\"400\" fill=\"#292929\">任务绑定配置版本、启用清单和能力来源哈希；更改只影响后续任务。</text><text x=\"350\" y=\"629\" font-size=\"13\" font-weight=\"400\" fill=\"#777\">已关闭能力必须不被加载；保存成功不能冒充权限隔离或连接核验成功。</text><rect x=\"350\" y=\"694\" width=\"750\" height=\"111\" rx=\"8\" fill=\"#f3f3f3\" stroke=\"#ccc\" /><text x=\"370\" y=\"726\" font-size=\"17\" font-weight=\"600\" fill=\"#292929\">启动能力可能执行本机程序</text><text x=\"370\" y=\"759\" font- t.id=s.id;b.onclick=()=>go(s.id);$('#nav').append(b);const t=document.createElement('button');t.className='thumb';t.innerHTML=s.svg+'<h3>'+String(i+1).padStart(2,'0')+' · '+s.title+'</h3>';t.onclick=()=>go(s.id);$('#gallery').append(t)});function go(id){location.hash=id}function render(){const id=location.hash.slice(1);current=screens.findIndex(s=>s.id===id);const overview=current<0;$('#gallery').hidden=!overview;$('#flow').hidden=!overview;$('#canvas').hidden=overview;$('#notes').hidden=overview;$('#screen-title').textContent=overview?'完整流程与分支':String(current+1).padStart(2,'0')+' · '+screens[current].title;$('#prev').disabled=overview||current===0;$('#next').disabled=overview||current===screens.length-1;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.id===id?'page':'false'));if(!overview){const s=screens[current];$('#canvas').innerHTML=s.svg;const left=document.createElement('div');const h=document.createElement('h3');h.textContent='交互说明';left.append(h);const ol=document.createElement('ol');s.notes.forEach(n=>{const li=document.createElement('li');li.textContent=n;ol.append(li)});left.append(ol);const right=document.createElement('div');right.innerHTML='<h3>查看方式</h3><p class="example">点击线稿中有链接的按钮可以跳转到相关界面。其他按钮是操作位置示意。左右方向键翻页，Esc 返回总览。桌面端按 1200 × 960 设计（首页保持原尺寸）。</p>';$('#notes').replaceChildren(left,right)}}$('#overview').onclick=()=>go('overview');$('#prev').onclick=()=>{if(current>0)go(screens[current-1].id)};$('#next').onclick=()=>{if(current>=0&&current<screens.length-1)go(screens[current+1].id)};document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')$('#prev').click();if(e.key==='ArrowRight')$('#next').click();if(e.key==='Escape')go('overview')});document.addEventListener('click',e=>{const a=e.target.closest('[data-screen]');if(a){e.preventDefault();go(a.dataset.screen)}});window.addEventListener('hashchange',render);render();</script></html>
