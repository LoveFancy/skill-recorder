<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" font-family="PingFang SC,Microsoft YaHei,sans-serif"><g opacity="0.18" pointer-events="none"><svg width="1200" height="900" viewBox="0 0 1200 900" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="900" rx="0" fill="white" stroke="none" /><text x="48" y="86" font-size="24" font-weight="600" fill="#292929" text-anchor="start">首页：沿用截图中的录制器</text><text x="48" y="134" font-size="16" font-weight="400" fill="#787878" text-anchor="start">保留圆形录制按钮、00:00 计时器。</text><text x="48" y="168" font-size="16" font-weight="400" fill="#787878" text-anchor="start">保留录制内容、语音旁白、采集内容、记录入口。</text><text x="48" y="202" font-size="16" font-weight="400" fill="#787878" text-anchor="start">底部状态行仅保留摘要，点击进入统一设置。</text><text x="48" y="236" font-size="16" font-weight="400" fill="#787878" text-anchor="start">浏览器、AI、Agent、语音与隐私集中管理。</text><text x="48" y="270" font-size="16" font-weight="400" fill="#787878" text-anchor="start">不再向下展开配置；圆按钮与计时器保持不变。</text><text x="48" y="824" font-size="14" font-weight="400" fill="#787878" text-anchor="start">黑白线稿 · 依据用户提供的真实界面</text><rect x="650" y="28" width="420" height="826" rx="14" fill="#f7f7f7" stroke="#292929" /><rect x="650" y="28" width="420" height="36" rx="0" fill="white" stroke="none" /><circle cx="668" cy="46" r="6" fill="#dddddd" /><circle cx="688" cy="46" r="6" fill="#dddddd" /><circle cx="708" cy="46" r="6" fill="#dddddd" /><text x="734" y="52" font-size="15" font-weight="600" fill="#787878" text-anchor="start">技能录制器</text><line x1="650" y1="64" x2="1070" y2="64" stroke="#cccccc" /><a href="#06-recording" data-screen="06-recording" aria-label="开始或结束录制"><circle cx="860.0" cy="156" r="39" fill="white" stroke="#cccccc" /><circle cx="860.0" cy="156" r="16" fill="#292929" /></a><text x="860.0" y="233" text-anchor="middle" font-size="37" font-weight="600" fill="#787878" font-family="monospace">00:00</text><text x="860.0" y="263" font-size="14" font-weight="400" fill="#787878" text-anchor="middle">准备录制 · Mi Monitor</text><rect x="670" y="300" width="380" height="72" rx="12" fill="white" stroke="#cccccc" /><text x="687" y="328" font-size="16" font-weight="600" fill="#292929" text-anchor="start">录制内容</text><text x="687" y="351" font-size="13" font-weight="400" fill="#787878" text-anchor="start">整个屏幕 · Mi Monitor</text><rect x="901" y="317" width="148" height="38" rx="10" fill="#f7f7f7" stroke="#cccccc" /><text x="975.0" y="341.0" font-size="14" font-weight="400" fill="#292929" text-anchor="middle">选择屏幕或应用</text><rect x="670" y="395" width="380" height="58" rx="12" fill="#eeeeee" stroke="#cccccc" /><text x="687" y="419" font-size="16" font-weight="600" fill="#292929" text-anchor="start">语音旁白</text><text x="687" y="441" font-size="12" font-weight="400" fill="#787878" text-anchor="start">中文</text><text x="958" y="429" font-size="17" font-weight="400" fill="#787878" text-anchor="start">⚙</text><rect x="992" y="413" width="37" height="22" rx="11" fill="#292929" stroke="none" /><circle cx="1019" cy="424" r="8" fill="white" /><rect x="670" y="465" width="380" height="59" rx="12" fill="white" stroke="#cccccc" /><text x="692" y="490" font-size="16" font-weight="600" fill="#292929" text-anchor="start">记录屏幕和操作活动</text><text x="692" y="511" font-size="12" font-weight="400" fill="#787878" text-anchor="start">查看具体采集内容</text><text x="1028" y="499" font-size="21" font-weight="400" fill="#787878" text-anchor="start">›</text><a href="#07-records" data-screen="07-records"><rect x="670" y="532" width="380" height="59" rx="12" fill="white" stroke="#292929" /><text x="692" y="557" font-size="16" font-weight="600" fill="#292929" text-anchor="start">查看录制记录  4</text><text x="692" y="578" font-size="12" font-weight="400" fill="#787878" text-anchor="start">4 条待分析</text><text x="1028" y="566" font-size="21" font-weight="400" fill="#787878" text-anchor="start">›</text></a><text x="671" y="646" font-size="16" font-weight="400" fill="#292929" text-anchor="start">✓</text><text x="693" y="646" font-size="13" font-weight="400" fill="#787878" text-anchor="start">智能处理</text><text x="791" y="646" font-size="11" font-weight="400" fill="#787878" text-anchor="start">Claude Code · 专用环境</text><a href="#02-settings" data-screen="02-settings" aria-label="配置"><rect x="991" y="625" width="58" height="27" rx="10" fill="#f7f7f7" stroke="#cccccc" /><text x="1020.0" y="643.5" font-size="14" font-weight="400" fill="#292929" text-anchor="middle">配置</text></a><text x="671" y="679" font-size="16" font-weight="400" fill="#292929" text-anchor="start">✓</text><text x="693" y="679" font-size="13" font-weight="400" fill="#787878" text-anchor="start">语音转写</text><text x="1049" y="679" font-size="12" font-weight="400" fill="#787878" text-anchor="end">SenseVoice · 本地处理</text><text x="671" y="712" font-size="16" font-weight="400" fill="#292929" text-anchor="start">✓</text><text x="693" y="712" font-size="13" font-weight="400" fill="#787878" text-anchor="start">隐私保护</text><text x="1049" y="712" font-size="12" font-weight="400" fill="#787878" text-anchor="end">本地处理</text><text x="671" y="745" font-size="16" font-weight="400" fill="#292929" text-anchor="start">✓</text><text x="693" y="745" font-size="13" font-weight="400" fill="#787878" text-anchor="start">Chrome 插件</text><rect x="863" y="724" width="91" height="27" rx="10" fill="#f7f7f7" stroke="#cccccc" /><text x="908.5" y="742.5" font-size="14" font-weight="400" fill="#292929" text-anchor="middle">重新连接</text><text x="1028" y="745" font-size="12" font-weight="400" fill="#787878" text-anchor="end">已连接</text><text x="860.0" y="785" font-size="12" font-weight="400" fill="#787878" text-anchor="middle">⌘⇧R 随时开始或结束录制</text><a href="#02-settings" data-screen="02-settings" aria-label="查看配置向下展开"><rect x="48" y="400" width="250" height="38" rx="10" fill="#f7f7f7" stroke="#cccccc" /><text x="173.0" y="424.0" font-size="14" font-weight="400" fill="#292929" text-anchor="middle">查看配置向下展开</text></a><a href="#05-api-fallback" data-screen="05-api-fallback" aria-label="查看未安装 Agent 状态"><rect x="48" y="455" width="250" height="38" rx="10" fill="#f7f7f7" stroke="#cccccc" /><text x="173.0" y="479.0" font-size="14" font-weight="400" fill="#292929" text-anchor="middle">查看未安装 Agent 状态</text></a><a href="#30-general" data-screen="30-general"><rect x="972" y="72" width="78" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="986" y="97" font-size="14" font-weight="400" fill="#292929">设置</text></a></svg></g><rect width="1200" height="960" fill="#f5f4f0" opacity="0.65" /><rect x="240" y="60" width="720" height="660" rx="8" fill="white" stroke="#d8d5cf" /><text x="276" y="108" font-size="25" font-weight="600" fill="#30302e">这次录制，想沉淀什么？</text><a href="#01-home" data-screen="01-home"><text x="915" y="106" font-size="13" font-weight="400" fill="#66645f">×</text></a><text x="276" y="142" font-size="14" font-weight="400" fill="#77746e">先确认目标，再开始录制。分析和澄清会沿用你的说明。</text><text x="276" y="191" font-size="14" font-weight="600" fill="#30302e">希望产出什么</text><rect x="276" y="211" width="185" height="44" rx="8" fill="white" stroke="#d8d5cf" /><circle cx="294" cy="233" r="6" fill="white" stroke="#777" /><text x="309" y="238" font-size="13" font-weight="400" fill="#30302e">整理一份 SOP</text><rect x="477" y="211" width="185" height="44" rx="8" fill="#efeeea" stroke="#d8d5cf" /><circle cx="495" cy="233" r="6" fill="white" stroke="#777" /><circle cx="495" cy="233" r="3" fill="#333" /><text x="510" y="238" font-size="13" font-weight="400" fill="#30302e">制作一个 Skill</text><rect x="678" y="211" width="185" height="44" rx="8" fill="white" stroke="#d8d5cf" /><circle cx="696" cy="233" r="6" fill="white" stroke="#777" /><text x="711" y="238" font-size="13" font-weight="400" fill="#30302e">其他 / 暂不确定</text><text x="276" y="292" font-size="16" font-weight="600" fill="#30302e">你想让它帮你完成什么？</text><rect x="276" y="311" width="648" height="106" rx="8" fill="white" stroke="#d8d5cf" /><text x="292" y="340" font-size="15" font-weight="400" fill="#77746e">例如：根据订单生成报价单，核对客户联系人，</text><text x="292" y="369" font-size="15" font-weight="400" fill="#77746e">确认后通过邮箱发送。</text><rect x="276" y="430" width="648" height="152" rx="8" fill="#f7f6f2" stroke="#d8d5cf" /><text x="296" y="461" font-size="16" font-weight="600" fill="#30302e">● 正在听你描述目标…</text><text x="296" y="491" font-size="16" font-weight="400" fill="#77746e">00:18   ▁ ▃ ▅ ▂ ▆ ▃ ▁ ▄ ▂</text><text x="296" y="518" font-size="12" font-weight="400" fill="#77746e">只采集这段目标语音；尚未开始屏幕录制。</text><a href="#43-intent-review" data-screen="43-intent-review"><rect x="296" y="532" width="177" height="42" rx="8" fill="#f1f0ec" stroke="#d8d5cf" /><text x="312" y="559" font-size="14" font-weight="400" fill="#333">结束并转成文字</text></a><a href="#41-recording-intent" data-screen="41-recording-intent"><text x="780" y="559" font-size="13" font-weight="400" fill="#66645f">取消这段语音</text></a><text x="696" y="669" font-size="13" font-weight="400" fill="#999">请先结束语音并核对文字</text><a href="#01-home" data-screen="01-home"><text x="276" y="669" font-size="13" font-weight="400" fill="#66645f">返回，不开始录制</text></a><line x1="240" x2="960" y1="620" y2="620" stroke="#dedbd5"/></svg>