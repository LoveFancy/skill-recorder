8" text-anchor="start">已录制</text><text x="24" y="234" font-size="15" font-weight="600" fill="#292929" text-anchor="start">尚未分析</text><text x="24" y="257" font-size="10" font-weight="400" fill="#787878" text-anchor="start">27秒  872.7 KB  视频  旁白</text><rect x="12" y="283" width="274" height="88" rx="10" fill="white" stroke="#cccccc" /><text x="24" y="307" font-size="12" font-weight="400" fill="#787878" text-anchor="start">10月13日 11:18</text><text x="225" y="307" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已分析</text><text x="24" y="332" font-size="15" font-weight="600" fill="#292929" text-anchor="start">浏览百度热搜话题</text><text x="24" y="355" font-size="10" font-weight="400" fill="#787878" text-anchor="start">30秒  3.9 MB  4 steps  视频  旁白</text><rect x="12" y="381" width="274" height="88" rx="10" fill="white" stroke="#cccccc" /><text x="24" y="405" font-size="12" font-weight="400" fill="#787878" text-anchor="start">10月13日 11:05</text><text x="225" y="405" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已录制</text><text x="24" y="430" font-size="15" font-weight="600" fill="#292929" text-anchor="start">尚未分析</text><text x="24" y="453" font-size="10" font-weight="400" fill="#787878" text-anchor="start">42秒  2.2 MB  视频  旁白</text><rect x="12" y="479" width="274" height="88" rx="10" fill="white" stroke="#cccccc" /><text x="24" y="503" font-size="12" font-weight="400" fill="#787878" text-anchor="start">10月12日 21:23</text><text x="225" y="503" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已录制</text><text x="24" y="528" font-size="15" font-weight="600" fill="#292929" text-anchor="start">尚未分析</text><text x="24" y="551" font-size="10" font-weight="400" fill="#787878" text-anchor="start">11秒  776.4 KB  视频  旁白</text><rect x="12" y="577" width="274" height="88" rx="10" fill="white" stroke="#cccccc" /><text x="24" y="601" font-size="12" font-weight="400" fill="#787878" text-anchor="start">10月12日 21:22</text><text x="225" y="601" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已录制</text><text x="24" y="626" font-size="15" font-weight="600" fill="#292929" text-anchor="start">尚未分析</text><text x="24" y="649" font-size="10" font-weight="400" fill="#787878" text-anchor="start">39秒  1.7 MB  视频  旁白</text><rect x="12" y="675" width="274" height="88" rx="10" fill="white" stroke="#cccccc" /><text x="24" y="699" font-size="12" font-weight="400" fill="#787878" text-anchor="start">10月12日 21:06</text><text x="225" y="699" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已分析</text><text x="24" y="724" font-size="15" font-weight="600" fill="#292929" text-anchor="start">整理工作簿</text><text x="24" y="747" font-size="10" font-weight="400" fill="#787878" text-anchor="start">16秒  966.9 KB  3 steps  视频  旁白</text><rect x="12" y="773" width="274" height="88" rx="10" fill="white" stroke="#cccccc" /><text x="24" y="797" font-size="12" font-weight="400" fill="#787878" text-anchor="start">10月10日 13:24</text><text x="225" y="797" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已分析</text><text x="24" y="822" font-size="15" font-weight="600" fill="#292929" text-anchor="start">导出订单报表</text><text x="24" y="845" font-size="10" font-weight="400" fill="#787878" text-anchor="start">1分23秒  3.5 MB  6 steps  视频</text><rect x="290" y="90" width="5" height="510" rx="3" fill="#cccccc" stroke="none" /><line x1="300" y1="100" x2="1200" y2="100" stroke="#cccccc" transform="translate(0,60) " /><circle cx="377" cy="306" r="7" fill="white" stroke="#292929" transform="translate(0,60) " /><circle cx="377" cy="306" r="3.5" fill="#292929" transform="translate(0,60) " /><circle cx="377" cy="342" r="7" fill="white" stroke="#292929" transform="translate(0,60) " /><line x1="300" y1="840" x2="1200" y2="840" stroke="#cccccc" transform="translate(0,60) " /><a href="#11-question" data-screen="11-question"><line x1="510" y1="87" x2="636" y2="87" stroke="#292929" /></a><line x1="300" y1="96" x2="1200" y2="96" stroke="#cccccc" /></svg></g><rect x="300" width="900" height="960" fill="#faf9f6"/><text x="334" y="55" font-size="18" font-weight="600" fill="#333">1 分析   →   2 澄清和补充   →   3 生成</text><text x="334" y="119" font-size="24" font-weight="600" fill="#333">SOP 文档预览</text><text x="334" y="155" font-size="14" font-weight="400" fill="#333">根据录制目标与已审核规则整理，导出为 Markdown。</text><rect x="334" y="186" width="830" height="582" rx="8" fill="white" stroke="#d8d5cf"/><text x="357" y="225" font-size="21" font-weight="600" fill="#333">订单报价与发送 SOP</text><text x="357" y="268" font-size="14" font-weight="400" fill="#333">目的：按订单准备报价单，发送前由业务人员确认。</text><text x="357" y="315" font-size="17" font-weight="600" fill="#333">适用范围</text><text x="357" y="350" font-size="14" font-weight="400" fill="#333">已支付且未退款的订单；例外情况需确认。</text><text x="357" y="400" font-size="17" font-weight="600" fill="#333">操作步骤</text><text x="357" y="440" font-size="14" font-weight="400" fill="#333">1. 获取订单号，核对订单状态与客户联系人。</text><text x="357" y="481" font-size="14" font-weight="400" fill="#333">2. 准备报价单与邮件草稿。</text><text x="357" y="522" font-size="14" font-weight="400" fill="#333">3. 人工确认正文和附件后，再按业务规定发送。</text><text x="357" y="579" font-size="17" font-weight="600" fill="#333">检查与异常</text><text x="357" y="620" font-size="14" font-weight="400" fill="#333">联系人冲突时询问业务人员；未核验步骤标为待验证。</text><text x="357" y="683" font-size="12" font-weight="400" fill="#333">来源：录制目标 v1 · 分析 v1 · 已审核补充内容</text><text x="357" y="721" font-size="12" font-weight="400" fill="#333">文档描述流程，不代表已经执行或验证了每个步骤。</text><a href="#20-create-targets" data-screen="20-create-targets"><text x="334" y="838" font-size="14" font-weight="400" fill="#333">返回选择输出目标</text></a><a href="#47-sop-exported" data-screen="47-sop-exported"><text x="1020" y="838" font-size="14" font-weight="400" fill="#333">导出 SOP.md</text></a></svg>