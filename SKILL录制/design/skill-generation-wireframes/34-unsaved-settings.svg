" font-size="25" font-weight="600" fill="#292929">AI 模型</text><text x="350" y="187" font-size="14" font-weight="400" fill="#777">示意：编辑后尚未保存。</text><rect x="475" y="304" width="465" height="255" rx="8" fill="white" stroke="#ccc" /><text x="502" y="351" font-size="22" font-weight="600" fill="#292929">有尚未保存的更改</text><text x="502" y="395" font-size="16" font-weight="400" fill="#292929">离开前是否保存 AI 模型设置？</text><text x="502" y="428" font-size="14" font-weight="400" fill="#777">检查状态不是配置变更，不触发此确认。</text><a href="#05-api-fallback" data-screen="05-api-fallback"><rect x="502" y="476" width="122" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="516" y="501" font-size="14" font-weight="400" fill="#292929">继续编辑</text></a><a href="#01-home" data-screen="01-home"><rect x="639" y="476" width="122" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="653" y="501" font-size="14" font-weight="400" fill="#292929">放弃更改</text></a><a href="#01-home" data-screen="01-home"><rect x="776" y="476" width="140" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="790" y="501" font-size="14" font-weight="400" fill="#292929">保存并离开</text></a></svg>