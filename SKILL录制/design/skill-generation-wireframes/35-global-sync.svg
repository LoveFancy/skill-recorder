<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="1200" height="900" rx="0" fill="#f2f2f2" stroke="#ccc" /><text x="30" y="30" font-size="13" font-weight="400" fill="#777">技能录制器 · 原窗口保留在后方</text><rect x="48" y="54" width="1104" height="798" rx="14" fill="white" stroke="#ccc" /><rect x="48" y="54" width="252" height="798" rx="14" fill="#f7f7f7" stroke="#ccc" /><text x="78" y="99" font-size="24" font-weight="600" fill="#292929">设置</text><a href="#01-home" data-screen="01-home"><text x="1110" y="98" font-size="26" font-weight="400" fill="#292929">×</text></a><a href="#01-home" data-screen="01-home"><text x="78" y="148" font-size="16" font-weight="400" fill="#292929">‹ 返回应用</text></a><a href="#30-general" data-screen="30-general"><text x="86" y="209" font-size="16" font-weight="400" fill="#292929">通用</text></a><a href="#31-browser" data-screen="31-browser"><text x="86" y="266" font-size="16" font-weight="400" fill="#292929">浏览器插件</text></a><a href="#05-api-fallback" data-screen="05-api-fallback"><text x="86" y="323" font-size="16" font-weight="400" fill="#292929">AI 模型</text></a><a href="#02-settings" data-screen="02-settings"><rect x="66" y="352" width="216" height="44" rx="8" fill="#e8e8e8" stroke="#ccc" /><text x="86" y="380" font-size="16" font-weight="600" fill="#292929">Agent 能力</text></a><a href="#32-capture-settings" data-screen="32-capture-settings"><text x="86" y="437" font-size="16" font-weight="400" fill="#292929">语音转写</text></a><a href="#37-privacy-settings" data-screen="37-privacy-settings"><text x="86" y="494" font-size="16" font-weight="400" fill="#292929">隐私保护</text></a><text x="78" y="787" font-size="12" font-weight="400" fill="#777">所有页面共用这些配置</text><text x="78" y="810" font-size="12" font-weight="400" fill="#777">不会自动修改当前运行任务</text><text x="338" y="98" font-size="14" font-weight="400" fill="#777">设置  /  Agent 能力</text><text x="350" y="155" font-size="25" font-weight="600" fill="#292929">同步全局配置</text><text x="350" y="187" font-size="14" font-weight="400" fill="#777">发现变动先展示差异，确认后更新专用配置；不覆盖当前任务。</text><rect x="350" y="231" width="750" height="83" rx="8" fill="white" stroke="#ccc" /><text x="370" y="261" font-size="17" font-weight="600" fill="#292929">已发现新增 MCP：业务系统</text><text x="370" y="289" font-size="13" font-weight="400" fill="#777">来源：用户级配置；新增能力默认关闭</text><text x="875" y="261" font-size="14" font-weight="400" fill="#292929">○ 待同步</text><rect x="350" y="335" width="750" height="83" rx="8" fill="white" stroke="#ccc" /><text x="370" y="365" font-size="17" font-weight="600" fill="#292929">已启用邮箱 MCP 配置发生变化</text><text x="370" y="393" font-size="13" font-weight="400" fill="#777">命令 / 参数 / 凭据引用变化，需要重新检查；暂不可自动加载</text><text x="875" y="365" font-size="14" font-weight="400" fill="#292929">! 需复核</text><rect x="350" y="439" width="750" height="83" rx="8" fill="white" stroke="#ccc" /><text x="370" y="469" font-size="17" font-weight="600" fill="#292929">Skill“表格处理”已更新</text><text x="370" y="497" font-size="13" font-weight="400" fill="#777">内容哈希已改变；保留选择，但需确认新版本</text><text x="875" y="469" font-size="14" font-weight="400" fill="#292929">! 需复核</text><rect x="350" y="543" width="750" height="83" rx="8" fill="white" stroke="#ccc" /><text x="370" y="573" font-size="17" font-weight="600" fill="#292929">Skill“邮件写作”来源已移除</text><text x="370" y="601" font-size="13" font-weight="400" fill="#777">保留失效记录，应用配置不再提供此能力</text><text x="875" y="573" font-size="14" font-weight="400" fill="#292929">○ 来源失效</text><text x="350" y="680" font-size="14" font-weight="400" fill="#292929">未变化能力保留开关。新能力默认关闭，删除或冲突项禁止自动加载。</text><text x="350" y="715" font-size="13" font-weight="400" fill="#777">同步读取失败时保留上一快照；不会把失败显示为“没有能力”。</text><a href="#02-settings" data-screen="02-settings"><rect x="350" y="769" width="150" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="364" y="794" font-size="14" font-weight="400" fill="#292929">暂不更新</text></a><a href="#04-capabilities" data-screen="04-capabilities"><rect x="889" y="769" width="211" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="903" y="794" font-size="14" font-weight="400" fill="#292929">确认同步差异</text></a></svg>