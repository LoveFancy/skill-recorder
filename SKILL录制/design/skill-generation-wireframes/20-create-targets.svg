 rx="12" fill="white" stroke="#cccccc" transform="translate(0,60) " /><text x="364" y="232" font-size="16" font-weight="600" fill="#292929" text-anchor="start" transform="translate(0,60) ">Scout 技能</text><text x="364" y="262" font-size="13" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">按需执行的技能，</text><text x="364" y="285" font-size="13" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">根据描述匹配任务。</text><rect x="552" y="200" width="188" height="168" rx="12" fill="white" stroke="#cccccc" transform="translate(0,60) " /><text x="568" y="232" font-size="16" font-weight="600" fill="#292929" text-anchor="start" transform="translate(0,60) ">Scout 自动化</text><text x="568" y="262" font-size="13" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">按计划或触发条件</text><text x="568" y="285" font-size="13" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">执行的多步骤自动化。</text><rect x="756" y="200" width="188" height="168" rx="12" fill="white" stroke="#cccccc" transform="translate(0,60) " /><text x="772" y="232" font-size="16" font-weight="600" fill="#292929" text-anchor="start" transform="translate(0,60) ">Cowork 技能</text><text x="772" y="262" font-size="13" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">用于 Microsoft 365</text><text x="772" y="285" font-size="13" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">Copilot 的按需技能。</text><a href="#28-generic-plan" data-screen="28-generic-plan" transform="translate(0,60) "><rect x="960" y="200" width="188" height="168" rx="12" fill="white" stroke="#cccccc" /><text x="976" y="232" font-size="16" font-weight="600" fill="#292929" text-anchor="start">通用智能体技能</text><text x="976" y="262" font-size="13" font-weight="400" fill="#787878" text-anchor="start">适用于支持技能的</text><text x="976" y="285" font-size="13" font-weight="400" fill="#787878" text-anchor="start">智能体，不依赖专属工具。</text></a><rect x="348" y="387" width="188" height="134" rx="12" fill="white" stroke="#cccccc" transform="translate(0,60) " /><text x="364" y="419" font-size="16" font-weight="600" fill="#787878" text-anchor="start" transform="translate(0,60) ">Copilot Studio</text><text x="364" y="449" font-size="13" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">即将推出</text><a href="#13-plan" data-screen="13-plan" transform="translate(0,60) "><rect x="552" y="387" width="270" height="164" rx="12" fill="white" stroke="#292929" /><text x="568" y="419" font-size="16" font-weight="600" fill="#292929" text-anchor="start">Claude Code Skill</text><text x="568" y="449" font-size="13" font-weight="400" fill="#787878" text-anchor="start">可使用本应用已启用的 MCP 与 Skill 参考资源。</text><text x="568" y="472" font-size="13" font-weight="400" fill="#787878" text-anchor="start">只生成并导出，不自动运行。</text><rect x="568" y="507" width="85" height="28" rx="8" fill="#f7f7f7" stroke="none" /><text x="610.5" y="527" font-size="12" font-weight="400" fill="#787878" text-anchor="middle">新增目标</text></a><text x="348" y="624" font-size="14" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">处理后端：Claude Code · 专用环境</text><text x="348" y="658" font-size="14" font-weight="400" fill="#787878" text-anchor="start" transform="translate(0,60) ">输出目标由你选择，与使用哪个 Agent 生成分开。</text><rect x="301" y="36" width="898" height="60" rx="0" fill="white" stroke="none" /><a href="#08-analysis" data-screen="08-analysis"><text x="332" y="64" font-size="17" font-weight="400" fill="#787878" text-anchor="start">分析</text><text x="375" y="64" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已分析</text></a><text x="477" y="65" font-size="18" font-weight="400" fill="#787878" text-anchor="start">›</text><a href="#12-facts" data-screen="12-facts"><text x="510" y="64" font-size="17" font-weight="400" fill="#787878" text-anchor="start">澄清和补充</text><text x="610" y="64" font-size="11" font-weight="400" fill="#787878" text-anchor="start">已审核</text></a><text x="655" y="65" font-size="18" font-weight="400" fill="#787878" text-anchor="start">›</text><a href="#20-create-targets" data-screen="20-create-targets"><text x="688" y="64" font-size="17" font-weight="600" fill="#292929" text-anchor="start">生成</text><text x="731" y="64" font-size="11" font-weight="400" fill="#787878" text-anchor="start">选择目标</text><line x1="688" y1="87" x2="814" y2="87" stroke="#292929" /></a><text x="1159" y="65" font-size="12" font-weight="400" fill="#787878" text-anchor="end">同一条录制</text><line x1="300" y1="96" x2="1200" y2="96" stroke="#cccccc" /><a href="#46-sop-preview" data-screen="46-sop-preview"><text x="348" y="785" font-size="14" font-weight="400" fill="#333">整理为 SOP 文档（Markdown） →</text></a></svg>