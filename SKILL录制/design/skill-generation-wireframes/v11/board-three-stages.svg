stroke="#d8d8d5"/><text x="950" y="864" font-size="14" fill="white" font-weight="500">确认并生成</text></a><text x="304" y="200" font-size="24" fill="#333" font-weight="600">确认这份分析</text><a href="#deep-edit" data-screen="deep-edit" aria-label="deep-edit"><text x="1118" y="200" font-size="13" fill="#777" font-weight="400">修改</text></a><text x="304" y="237" font-size="15" fill="#777" font-weight="400">根据订单准备报价单，发送前先由你确认。</text><text x="308" y="291" font-size="14" fill="#888" font-weight="400">1</text><text x="338" y="291" font-size="17" fill="#333" font-weight="500">核对订单</text><text x="338" y="319" font-size="14" fill="#777" font-weight="400">处理你提供的订单号，读取订单和客户信息。</text><text x="308" y="369" font-size="14" fill="#888" font-weight="400">2</text><text x="338" y="369" font-size="17" fill="#333" font-weight="500">准备报价单</text><text x="338" y="397" font-size="14" fill="#777" font-weight="400">按订单生成报价单，作为邮件附件。</text><text x="308" y="447" font-size="14" fill="#888" font-weight="400">3</text><text x="338" y="447" font-size="17" fill="#333" font-weight="500">准备邮件并确认</text><text x="338" y="475" font-size="14" fill="#777" font-weight="400">使用订单联系人；找不到时先询问你。</text><text x="308" y="525" font-size="14" fill="#888" font-weight="400">4</text><text x="338" y="525" font-size="17" fill="#333" font-weight="500">确认后发送</text><text x="338" y="553" font-size="14" fill="#777" font-weight="400">展示正文和附件，得到你的确认后再发送。</text><line x1="304" y1="597" x2="1156" y2="597" stroke="#dededb"/><text x="304" y="631" font-size="14" fill="#777" font-weight="600">每次需要提供</text><text x="304" y="660" font-size="15" fill="#333" font-weight="400">订单号；报价单和联系人按本次订单重新获取。</text><text x="304" y="712" font-size="14" fill="#777" font-weight="400">找不到联系人或附件时先询问，不自动猜测。</text><a href="#analysis-tools" data-screen="analysis-tools" aria-label="analysis-tools"><text x="304" y="773" font-size="13" fill="#888" font-weight="400">本次分析使用：录制材料、邮箱 MCP · 查看</text></a></svg><text x="6" y="475" font-size="14" fill="#333" font-weight="400">深度分析：确