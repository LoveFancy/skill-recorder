<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="1200" height="900" rx="10" fill="#fafaf9" stroke="#bbb"/><rect x="1" y="1" width="1198" height="35" rx="10" fill="white" stroke="none"/><text x="22" y="24" font-size="14" fill="#777" font-weight="500">技能录制器</text><line x1="0" y1="36" x2="1200" y2="36" stroke="#dededb"/><rect x="1" y="37" width="259" height="862" rx="0" fill="#f5f5f3" stroke="none"/><line x1="260" y1="36" x2="260" y2="900" stroke="#dededb"/><text x="24" y="78" font-size="16" fill="#555" font-weight="600">录制记录</text><a href="#home" data-screen="home" aria-label="home"><text x="191" y="78" font-size="13" fill="#333" font-weight="400">新录制</text></a><a href="#analysis" data-screen="analysis" aria-label="analysis"><rect x="14" y="104" width="232" height="88" rx="8" fill="#eaeae6" stroke="#999"/><text x="28" y="128" font-size="12" fill="#888" font-weight="400">今天 10:32</text><text x="28" y="153" font-size="16" fill="#333" font-weight="600">订单报价</text><text x="28" y="176" font-size="12" fill="#888" font-weight="400">4分32秒  ·  待完善</text></a><a href="#analysis" data-screen="analysis" aria-label="analysis"><rect x="14" y="208" width="232" height="88" rx="8" fill="white" stroke="#ddd"/><text x="28" y="232" font-size="12" fill="#888" font-weight="400">昨天 16:20</text><text x="28" y="257" font-size="16" fill="#333" font-weight="600">整理客户资料</text><text x="28" y="280" font-size="12" fill="#888" font-weight="400">4分32秒  ·  已保存</text></a><a href="#analysis" data-screen="analysis" aria-label="analysis"><rect x="14" y="312" width="232" height="88" rx="8" fill="white" stroke="#ddd"/><text x="28" y="336" font-size="12" fill="#888" font-weight="400">昨天 11:08</text><text x="28" y="361" font-size="16" fill="#333" font-weight="600">导出销售报表</text><text x="28" y="384" font-size="12" fill="#888" font-weight="400">4分32秒  ·  已分析</text></a><a href="#settings" data-screen="settings" aria-label="settings"><text x="24" y="865" font-size="14" fill="#666" font-weight="400">设置</text></a><rect x="261" y="37" width="938" height="63" rx="0" fill="white" stroke="none"/><a href="#analysis" data-screen="analysis" aria-label="analysis"><text x="308" y="74" font-size="17" fill="#888" font-weight="400">1 原始素材确认</text></a><text x="549" y="74" font-size="18" fill="#aaa" font-weight="400">›</text><rect x="568" y="48" width="218" height="40" rx="7" fill="#eaeae6" stroke="none"/><a href="#deep-result" data-screen="deep-result" aria-label="deep-result"><text x="584" y="74" font-size="17" fill="#333" font-weight="600">2 深度分析</text></a><text x="799" y="74" font-size="18" fill="#aaa" font-weight="400">›</text><a href="#preview" data-screen="preview" aria-label="preview"><text x="834" y="74" font-size="17" fill="#888" font-weight="400">3 生成</text></a><line x1="260" y1="100" x2="1200" y2="100" stroke="#dededb"/><text x="304" y="127" font-size="13" fill="#666" font-weight="400">订单报价</text><text x="428" y="127" font-size="12" fill="#999" font-weight="400">今天 10:32</text><text x="960" y="127" font-size="12" fill="#888" font-weight="400">待确认</text><line x1="260" y1="144" x2="1200" y2="144" stroke="#dededb"/><rect x="261" y="818" width="938" height="81" rx="0" fill="white" stroke="none"/><line x1="260" y1="818" x2="1200" y2="818" stroke="#dededb"/><a href="#analysis" data-screen="analysis" aria-label="analysis"><text x="304" y="861" font-size="14" fill="#777" font-weight="400">返回原始素材</text></a><a href="#clarify-loading" data-screen="clarify-loading" aria-label="clarify-loading"><text x="492" y="861" font-size="14" fill="#777" font-weight="400">重新分析</text></a><a href="#generating" data-screen="generating" aria-label="确认并生成草稿"><rect x="934" y="839" width="222" height="38" rx="8" fill="#303030" stroke="#d8d8d5"/><text x="950" y="864" font-size="14" fill="white" font-weight="500">确认并生成草稿</text></a><text x="304" y="200" font-size="24" fill="#333" font-weight="600">确认这份分析</text><a href="#deep-edit" data-screen="deep-edit" aria-label="deep-edit"><text x="1118" y="200" font-size="13" fill="#777" font-weight="400">修改</text></a><text x="304" y="237" font-size="15" fill="#777" font-weight="400">根据订单准备报价单，发送前先由你确认。</text><text x="308" y="291" font-size="14" fill="#888" font-weight="400">1</text><text x="338" y="291" font-size="17" fill="#333" font-weight="500">核对订单</text><text x="338" y="319" font-size="14" fill="#777" font-weight="400">处理你提供的订单号，读取订单和客户信息。</text><text x="308" y="369" font-size="14" fill="#888" font-weight="400">2</text><text x="338" y="369" font-size="17" fill="#333" font-weight="500">准备报价单</text><text x="338" y="397" font-size="14" fill="#777" font-weight="400">按订单生成报价单，作为邮件附件。</text><text x="308" y="447" font-size="14" fill="#888" font-weight="400">3</text><text x="338" y="447" font-size="17" fill="#333" font-weight="500">准备邮件并确认</text><text x="338" y="475" font-size="14" fill="#777" font-weight="400">收件人规则待补充，使用前先询问你。</text><text x="308" y="525" font-size="14" fill="#888" font-weight="400">4</text><text x="338" y="525" font-size="17" fill="#333" font-weight="500">确认后发送</text><text x="338" y="553" font-size="14" fill="#777" font-weight="400">展示正文和附件，得到你的确认后再发送。</text><line x1="304" y1="597" x2="1156" y2="597" stroke="#dededb"/><text x="304" y="631" font-size="14" fill="#777" font-weight="600">每次需要提供</text><text x="304" y="660" font-size="15" fill="#333" font-weight="400">订单号；报价单和联系人按本次订单重新获取。</text><rect x="304" y="685" width="852" height="42" rx="6" fill="#eeeee9" stroke="none"/><text x="320" y="712" font-size="14" fill="#333" font-weight="400">待补充：收件人规则尚未确定，草稿中会保留提醒。</text><a href="#analysis-tools" data-screen="analysis-tools" aria-label="analysis-tools"><text x="304" y="773" font-size="13" fill="#888" font-weight="400">本次分析使用：录制材料、邮箱 MCP · 查看</text></a></svg>