en="settings" aria-label="settings"><text x="24" y="865" font-size="14" fill="#666" font-weight="400">设置</text></a><rect x="261" y="37" width="938" height="63" rx="0" fill="white" stroke="none"/><a href="#analysis" data-screen="analysis" aria-label="analysis"><text x="308" y="74" font-size="17" fill="#888" font-weight="400">1 原始素材确认</text></a><text x="549" y="74" font-size="18" fill="#aaa" font-weight="400">›</text><rect x="568" y="48" width="218" height="40" rx="7" fill="#eaeae6" stroke="none"/><a href="#deep-result" data-screen="deep-result" aria-label="deep-result"><text x="584" y="74" font-size="17" fill="#333" font-weight="600">2 深度分析</text></a><text x="799" y="74" font-size="18" fill="#aaa" font-weight="400">›</text><a href="#preview" data-screen="preview" aria-label="preview"><text x="834" y="74" font-size="17" fill="#888" font-weight="400">3 生成</text></a><line x1="260" y1="100" x2="1200" y2="100" stroke="#dededb"/><text x="304" y="127" font-size="13" fill="#666" font-weight="400">订单报价</text><text x="428" y="127" font-size="12" fill="#999" font-weight="400">今天 10:32</text><line x1="260" y1="144" x2="1200" y2="144" stroke="#dededb"/><rect x="261" y="818" width="938" height="81" rx="0" fill="white" stroke="none"/><line x1="260" y1="818" x2="1200" y2="818" stroke="#dededb"/><a href="#materials" data-screen="materials" aria-label="materials"><text x="304" y="861" font-size="14" fill="#777" font-weight="400">＋ 补充说明或文件</text></a><a href="#deep-refining" data-screen="deep-refining" aria-label="提交并继续分析"><rect x="984" y="839" width="172" height="38" rx="8" fill="#303030" stroke="#d8d8d5"/><text x="1000" y="864" font-size="14" fill="white" font-weight="500">提交并继续分析</text></a><text x="304" y="205" font-size="24" fill="#333" font-weight="600">还需要你确认两点</text><text x="304" y="241" font-size="14" fill="#888" font-weight="400">选一个答案，也可以填写自己的做法。</text><text x="304" y="287" font-size="13" fill="#888" font-weight="400">问题 1</text><text x="304" y="319" font-size="20" fill="#333" font-weight="600">以后需要处理哪些订单？</text><a href="#clarify-answered" data-screen="clarify-answered" aria-label="clarify-answered"><rect x="304" y="337" width="852" height="36" rx="6" fill="#eeeee9" stroke="#bbb"/><text x="320" y="361" font-size="14" fill="#333" font-weight="400">●  我提供的订单号</text></a><a href="#clarify-answered" data-screen="clarify-answered" aria-label="clarify-answered"><rect x="304" y="381" width="852" height="36" rx="6" fill="white" stroke="#ddd"/><text x="320" y="405" font-size="14" fill="#333" font-weight="400">○  所有已支付、未退款的订单</text></a><a href="#clarify-other" data-screen="clarify-other" aria-label="clarify-other"><text x="312" y="445" font-size="14" fill="#333" font-weight="400">○  其他</text></a><a href="#clarify-unknown" data-screen="clarify-unknown" aria-label="clarify-unknown"><text x="1052" y="445" font-size="13" fill="#888" font-weight="400">暂不确定</text></a><line x1="304" y1="493" x2="1156" y2="493" stroke="#dededb"/><text x="304" y="531" font-size="13" fill="#888" font-weight="400">问题 2</text><text x="304" y="563" font-size="20" fill="#333" font-weight="600">报价单应该发给谁？</text><a href="#clarify-answered" data-screen="clarify-answered" aria-label="clarify-answered"><rect x="304" y="581" width="852" height="36" rx="6" fill="white" stroke="#ddd"/><text x="320" y="605" font-size="14" fill="#333" font-weight="400">○  订单里的客户联系人</text></a><a href="#clarify-answered" data-screen="clarify-answered" aria-label="clarify-answered"><rect x="304" y="625" width="852" height="36" rx="6" fill="white" stroke="#ddd"/><text x="320" y="649" font-size="14" fill="#333" font-weight="400">○  每次由我指定</text></a><a href="#clarify-other" data-screen="clarify-other" aria-label="clarify-other"><text x="312" y="689" font-size="14" fill="#333" font-weight="400">●  其他</text></a><a href="#clarify-unknown" data-screen="clarify-unknown" aria-label="clarify-unknown"><text x="1052" y="689" font-size="13" fill="#888" font-weight="400">暂不确定</text></a><rect x="304" y="705" width="852" height="64" rx="8" fill="white" stroke="#d8d8d5"/><text x="320" y="731" font-size="14" fill="#333" font-weight="400">使用客户档案中的采购联系人；有多个时先问我。</text></svg>