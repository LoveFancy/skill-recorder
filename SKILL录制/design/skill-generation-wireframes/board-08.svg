<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1710" viewBox="0 0 1260 1710" font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect width="1260" height="1710" fill="#f0efeb"/><text x="28" y="48" font-size="24" fill="#333">流程顺序 43–47 · v10</text><g transform="translate(25,85)"><svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 1200 900" font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="1200" height="900" rx="0" fill="#f2f2f2" stroke="#ccc" /><text x="30" y="30" font-size="13" font-weight="400" fill="#777">技能录制器 · 原窗口保留在后方</text><rect x="48" y="54" width="1104" height="798" rx="14" fill="white" stroke="#ccc" /><rect x="48" y="54" width="252" height="798" rx="14" fill="#f7f7f7" stroke="#ccc" /><text x="78" y="99" font-size="24" font-weight="600" fill="#292929">设置</text><a href="#01-home" data-screen="01-home"><text x="1110" y="98" font-size="26" font-weight="400" fill="#292929">×</text></a><a href="#01-home" data-screen="01-home"><text x="78" y="148" font-size="16" font-weight="400" fill="#292929">‹ 返回应用</text></a><a href="#30-general" data-screen="30-general"><text x="86" y="209" font-size="16" font-weight="400" fill="#292929">通用</text></a><a href="#31-browser" data-screen="31-browser"><text x="86" y="266" font-size="16" font-weight="400" fill="#292929">浏览器插件</text></a><a href="#05-api-fallback" data-screen="05-api-fallback"><text x="86" y="323" font-size="16" font-weight="400" fill="#292929">AI 模型</text></a><a href="#02-settings" data-screen="02-settings"><rect x="66" y="352" width="216" height="44" rx="8" fill="#e8e8e8" stroke="#ccc" /><text x="86" y="380" font-size="16" font-weight="600" fill="#292929">Agent 能力</text></a><a href="#32-capture-settings" data-screen="32-capture-settings"><text x="86" y="437" font-size="16" font-weight="400" fill="#292929">语音转写</text></a><a href="#37-privacy-settings" data-screen="37-privacy-settings"><text x="86" y="494" font-size="16" font-weight="400" fill="#292929">隐私保护</text></a><text x="78" y="787" font-size="12" font-weight="400" fill="#777">所有页面共用这些配置</text><text x="78" y="810" font-size="12" font-weight="400" fill="#777">不会自动修改当前运行任务</text><text x="338" y="98" font-size="14" font-weight="400" fill="#777">设置  /  Agent 能力</text><text x="350" y="155" font-size="25" font-weight="600" fill="#292929">局部能力异常</text><text x="350" y="187" font-size="14" font-weight="400" fill="#777">环境已就绪；某项能力失败不使整页染红。</text><rect x="350" y="230" width="750" height="83" rx="8" fill="white" stroke="#ccc" /><text x="370" y="260" font-size="17" font-weight="600" fill="#292929">Claude Code / 专用环境</text><text x="370" y="288" font-size="13" font-weight="400" fill="#777">已登录 · 环境 v3 · 启用配置已保存</text><text x="875" y="260" font-size="14" font-weight="400" fill="#292929">✓ 已就绪</text><rect x="350" y="348" width="750" height="137" rx="8" fill="#f3f3f3" stroke="#ccc" /><text x="370" y="382" font-size="18" font-weight="600" fill="#292929">! 邮箱 MCP · 已启用，但需重新认证</text><text x="370" y="416" font-size="14" font-weight="400" fill="#292929">仅影响依赖邮箱的补证；基础分析仍可使用。</text><rect x="370" y="440" width="160" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="384" y="465" font-size="14" font-weight="400" fill="#292929">查看脱敏详情</text><rect x="550" y="440" width="130" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="564" y="465" font-size="14" font-weight="400" fill="#292929">连接检查</text><rect x="350" y="527" width="750" height="89" rx="8" fill="white" stroke="#ccc" /><text x="370" y="556" font-size="17" font-weight="600" fill="#292929">表格处理 Skill</text><text x="370" y="586" font-size="12" font-weight="400" fill="#777">来源内容已变更；请确认同步差异后使用新版本</text><text x="817" y="556" font-size="12" font-weight="400" fill="#292929">需复核</text><rect x="1030" y="558" width="44" height="24" rx="12" fill="#555" stroke="#ccc" /><circle cx="1062" cy="570" r="8" fill="white" stroke="#aaa" /><a href="#35-global-sync" data-screen="35-global-sync"><rect x="350" y="650" width="190" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="364" y="675" font-size="14" font-weight="400" fill="#292929">查看同步差异</text></a><a href="#02-settings" data-screen="02-settings"><rect x="946" y="770" width="154" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="960" y="795" font-size="14" font-weight="400" fill="#292929">返回设置</text></a></svg><text x="8" y="507" font-size="15" fill="#333">43 · Agent 能力 · 已启用能力局部异常</text></g><g transform="translate(650,85)"><svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 1200 900" font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="1200" height="900" rx="0" fill="#f2f2f2" stroke="#ccc" /><text x="30" y="30" font-size="13" font-weight="400" fill="#777">技能录制器 · 原窗口保留在后方</text><rect x="48" y="54" width="1104" height="798" rx="14" fill="white" stroke="#ccc" /><rect x="48" y="54" width="252" height="798" rx="14" fill="#f7f7f7" stroke="#ccc" /><text x="78" y="99" font-size="24" font-weight="600" fill="#292929">设置</text><a href="#01-home" data-screen="01-home"><text x="1110" y="98" font-size="26" font-weight="400" fill="#292929">×</text></a><a href="#01-home" data-screen="01-home"><text x="78" y="148" font-size="16" font-weight="400" fill="#292929">‹ 返回应用</text></a><a href="#30-general" data-screen="30-general"><text x="86" y="209" font-size="16" font-weight="400" fill="#292929">通用</text></a><a href="#31-browser" data-screen="31-browser"><text x="86" y="266" font-size="16" font-weight="400" fill="#292929">浏览器插件</text></a><a href="#05-api-fallback" data-screen="05-api-fallback"><text x="86" y="323" font-size="16" font-weight="400" fill="#292929">AI 模型</text></a><a href="#02-settings" data-screen="02-settings"><rect x="66" y="352" width="216" height="44" rx="8" fill="#e8e8e8" stroke="#ccc" /><text x="86" y="380" font-size="16" font-weight="600" fill="#292929">Agent 能力</text></a><a href="#32-capture-settings" data-screen="32-capture-settings"><text x="86" y="437" font-size="16" font-weight="400" fill="#292929">语音转写</text></a><a href="#37-privacy-settings" data-screen="37-privacy-settings"><text x="86" y="494" font-size="16" font-weight="400" fill="#292929">隐私保护</text></a><text x="78" y="787" font-size="12" font-weight="400" fill="#777">所有页面共用这些配置</text><text x="78" y="810" font-size="12" font-weight="400" fill="#777">不会自动修改当前运行任务</text><text x="338" y="98" font-size="14" font-weight="400" fill="#777">设置  /  Agent 能力</text><text x="350" y="155" font-size="25" font-weight="600" fill="#292929">专用环境 · 需要处理</text><text x="350" y="187" font-size="14" font-weight="400" fill="#777">Claude 登录、环境生成、来源读取和加载隔离分别显示状态。</text><rect x="350" y="230" width="750" height="83" rx="8" fill="white" stroke="#ccc" /><text x="370" y="260" font-size="17" font-weight="600" fill="#292929">Claude Code</text><text x="370" y="288" font-size="13" font-weight="400" fill="#777">已安装 · 已登录</text><text x="875" y="260" font-size="14" font-weight="400" fill="#292929">✓ 已就绪</text><rect x="350" y="330" width="750" height="83" rx="8" fill="white" stroke="#ccc" /><text x="370" y="360" font-size="17" font-weight="600" fill="#292929">应用专用配置 v3</text><text x="370" y="388" font-size="13" font-weight="400" fill="#777">上一有效版本保留；2 项候选更改未生效</text><text x="875" y="360" font-size="14" font-weight="400" fill="#292929">✓ 已保存</text><rect x="350" y="446" width="750" height="176" rx="8" fill="#f3f3f3" stroke="#ccc" /><text x="370" y="481" font-size="18" font-weight="600" fill="#292929">! 当前版本无法证明关闭能力不会被自动加载</text><text x="370" y="517" font-size="14" font-weight="400" fill="#292929">不使用提示词冒充隔离；暂停自动加载 MCP / Skills。</text><text x="370" y="550" font-size="14" font-weight="400" fill="#292929">仍可使用受限的基础分析，或导出补充材料进行人工增强。</text><rect x="370" y="570" width="165" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="384" y="595" font-size="14" font-weight="400" fill="#292929">查看脱敏详情</text><rect x="557" y="570" width="145" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="571" y="595" font-size="14" font-weight="400" fill="#292929">重新检查</text><text x="350" y="679" font-size="14" font-weight="400" fill="#292929">设置保存失败：保持原配置有效；待保存选择仍在草稿中。</text><text x="350" y="714" font-size="13" font-weight="400" fill="#777">若环境本身不可写：暂停本地处理，显示修复原因，不静默切换 API。</text><a href="#02-settings" data-screen="02-settings"><rect x="946" y="770" width="154" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="960" y="795" font-size="14" font-weight="400" fill="#292929">返回设置</text></a></svg><text x="8" y="507" font-size="15" fill="#333">44 · Agent 能力 · 生成或隔离失败</text></g><g transform="translate(25,625)"><svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 1200 900" font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="1200" height="900" rx="0" fill="#f2f2f2" stroke="#ccc" /><text x="30" y="30" font-size="13" font-weight="400" fill="#777">技能录制器 · 原窗口保留在后方</text><rect x="48" y="54" width="1104" height="798" rx="14" fill="white" stroke="#ccc" /><rect x="48" y="54" width="252" height="798" rx="14" fill="#f7f7f7" stroke="#ccc" /><text x="78" y="99" font-size="24" font-weight="600" fill="#292929">设置</text><a href="#01-home" data-screen="01-home"><text x="1110" y="98" font-size="26" font-weight="400" fill="#292929">×</text></a><a href="#01-home" data-screen="01-home"><text x="78" y="148" font-size="16" font-weight="400" fill="#292929">‹ 返回应用</text></a><a href="#30-general" data-screen="30-general"><text x="86" y="209" font-size="16" font-weight="400" fill="#292929">通用</text></a><a href="#31-browser" data-screen="31-browser"><text x="86" y="266" font-size="16" font-weight="400" fill="#292929">浏览器插件</text></a><a href="#05-api-fallback" data-screen="05-api-fallback"><text x="86" y="323" font-size="16" font-weight="400" fill="#292929">AI 模型</text></a><a href="#02-settings" data-screen="02-settings"><text x="86" y="380" font-size="16" font-weight="400" fill="#292929">Agent 能力</text></a><a href="#32-capture-settings" data-screen="32-capture-settings"><rect x="66" y="409" width="216" height="44" rx="8" fill="#e8e8e8" stroke="#ccc" /><text x="86" y="437" font-size="16" font-weight="600" fill="#292929">语音转写</text></a><a href="#37-privacy-settings" data-screen="37-privacy-settings"><text x="86" y="494" font-size="16" font-weight="400" fill="#292929">隐私保护</text></a><text x="78" y="787" font-size="12" font-weight="400" fill="#777">所有页面共用这些配置</text><text x="78" y="810" font-size="12" font-weight="400" fill="#777">不会自动修改当前运行任务</text><text x="338" y="98" font-size="14" font-weight="400" fill="#777">设置  /  语音转写</text><text x="350" y="155" font-size="25" font-weight="600" fill="#292929">语音转写</text><text x="350" y="187" font-size="14" font-weight="400" fill="#777">管理默认语言与本地语音模型；旁白开关和麦克风仍在首页选择。</text><rect x="350" y="230" width="750" height="83" rx="8" fill="white" stroke="#ccc" /><text x="370" y="260" font-size="17" font-weight="600" fill="#292929">语音转写</text><text x="370" y="288" font-size="13" font-weight="400" fill="#777">SenseVoice · 本地模型已就绪</text><text x="875" y="260" font-size="14" font-weight="400" fill="#292929">✓ 已就绪</text><text x="350" y="360" font-size="17" font-weight="600" fill="#292929">默认语言</text><rect x="350" y="378" width="750" height="46" rx="8" fill="white" stroke="#ccc" /><text x="370" y="408" font-size="16" font-weight="400" fill="#292929">中文</text><text x="1060" y="408" font-size="16" font-weight="400" fill="#292929">▾</text><text x="350" y="490" font-size="14" font-weight="400" fill="#777">旁白开关、麦克风选择仍保留在首页，方便每次录制调整。</text><text x="350" y="530" font-size="14" font-weight="400" fill="#777">录制期间与本次采集冲突的配置禁用，并说明停止录制后可修改。</text><rect x="948" y="745" width="152" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="962" y="770" font-size="14" font-weight="400" fill="#292929">保存设置</text></svg><text x="8" y="507" font-size="15" fill="#333">45 · 全局设置 · 语音转写</text></g><g transform="translate(650,625)"><svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 1200 900" font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="1200" height="900" rx="0" fill="#f2f2f2" stroke="#ccc" /><text x="30" y="30" font-size="13" font-weight="400" fill="#777">技能录制器 · 原窗口保留在后方</text><rect x="48" y="54" width="1104" height="798" rx="14" fill="white" stroke="#ccc" /><rect x="48" y="54" width="252" height="798" rx="14" fill="#f7f7f7" stroke="#ccc" /><text x="78" y="99" font-size="24" font-weight="600" fill="#292929">设置</text><a href="#01-home" data-screen="01-home"><text x="1110" y="98" font-size="26" font-weight="400" fill="#292929">×</text></a><a href="#01-home" data-screen="01-home"><text x="78" y="148" font-size="16" font-weight="400" fill="#292929">‹ 返回应用</text></a><a href="#30-general" data-screen="30-general"><text x="86" y="209" font-size="16" font-weight="400" fill="#292929">通用</text></a><a href="#31-browser" data-screen="31-browser"><text x="86" y="266" font-size="16" font-weight="400" fill="#292929">浏览器插件</text></a><a href="#05-api-fallback" data-screen="05-api-fallback"><text x="86" y="323" font-size="16" font-weight="400" fill="#292929">AI 模型</text></a><a href="#02-settings" data-screen="02-settings"><text x="86" y="380" font-size="16" font-weight="400" fill="#292929">Agent 能力</text></a><a href="#37-privacy-settings" data-screen="37-privacy-settings"><rect x="66" y="466" width="216" height="44" rx="8" fill="#e8e8e8" stroke="#ccc" /><text x="86" y="494" font-size="16" font-weight="600" fill="#292929">隐私保护</text></a><a href="#32-capture-settings" data-screen="32-capture-settings"><text x="86" y="437" font-size="16" fill="#292929">语音转写</text></a><text x="78" y="787" font-size="12" font-weight="400" fill="#777">所有页面共用这些配置</text><text x="78" y="810" font-size="12" font-weight="400" fill="#777">不会自动修改当前运行任务</text><text x="338" y="98" font-size="14" font-weight="400" fill="#777">设置  /  隐私保护</text><text x="350" y="155" font-size="25" font-weight="600" fill="#292929">隐私保护</text><text x="350" y="187" font-size="14" font-weight="400" fill="#777">管理本地屏幕文本保护与隐私模型，独立于语音转写设置。</text><rect x="350" y="230" width="750" height="83" rx="8" fill="white" stroke="#ccc" /><text x="370" y="260" font-size="17" font-weight="600" fill="#292929">隐私保护</text><text x="370" y="288" font-size="13" font-weight="400" fill="#777">本地检测 · 开启后对分析及导出的材料进行保护</text><text x="875" y="260" font-size="14" font-weight="400" fill="#292929">✓ 已开启</text><rect x="350" y="340" width="180" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="364" y="365" font-size="14" font-weight="400" fill="#292929">模型与下载详情</text><text x="350" y="440" font-size="14" font-weight="400" fill="#777">关闭保护会减少截图中的文本保护；录制期间不可修改。</text><text x="350" y="480" font-size="14" font-weight="400" fill="#777">录制期间与本次采集冲突的配置禁用，并说明停止录制后可修改。</text><rect x="948" y="745" width="152" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="962" y="770" font-size="14" font-weight="400" fill="#292929">保存设置</text></svg><text x="8" y="507" font-size="15" fill="#333">46 · 全局设置 · 隐私保护</text></g><g transform="translate(25,1165)"><svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 1200 900" font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="1200" height="900" rx="0" fill="#f2f2f2" stroke="#ccc" /><text x="30" y="30" font-size="13" font-weight="400" fill="#777">技能录制器 · 原窗口保留在后方</text><rect x="48" y="54" width="1104" height="798" rx="14" fill="white" stroke="#ccc" /><rect x="48" y="54" width="252" height="798" rx="14" fill="#f7f7f7" stroke="#ccc" /><text x="78" y="99" font-size="24" font-weight="600" fill="#292929">设置</text><a href="#01-home" data-screen="01-home"><text x="1110" y="98" font-size="26" font-weight="400" fill="#292929">×</text></a><a href="#01-home" data-screen="01-home"><text x="78" y="148" font-size="16" font-weight="400" fill="#292929">‹ 返回应用</text></a><a href="#30-general" data-screen="30-general"><text x="86" y="209" font-size="16" font-weight="400" fill="#292929">通用</text></a><a href="#31-browser" data-screen="31-browser"><text x="86" y="266" font-size="16" font-weight="400" fill="#292929">浏览器插件</text></a><a href="#05-api-fallback" data-screen="05-api-fallback"><rect x="66" y="295" width="216" height="44" rx="8" fill="#e8e8e8" stroke="#ccc" /><text x="86" y="323" font-size="16" font-weight="600" fill="#292929">AI 模型</text></a><a href="#02-settings" data-screen="02-settings"><text x="86" y="380" font-size="16" font-weight="400" fill="#292929">Agent 能力</text></a><a href="#32-capture-settings" data-screen="32-capture-settings"><text x="86" y="437" font-size="16" font-weight="400" fill="#292929">语音转写</text></a><a href="#37-privacy-settings" data-screen="37-privacy-settings"><text x="86" y="494" font-size="16" font-weight="400" fill="#292929">隐私保护</text></a><text x="78" y="787" font-size="12" font-weight="400" fill="#777">所有页面共用这些配置</text><text x="78" y="810" font-size="12" font-weight="400" fill="#777">不会自动修改当前运行任务</text><text x="338" y="98" font-size="14" font-weight="400" fill="#777">设置  /  AI 模型</text><text x="350" y="155" font-size="25" font-weight="600" fill="#292929">AI 模型</text><text x="350" y="187" font-size="14" font-weight="400" fill="#777">示意：编辑后尚未保存。</text><rect x="475" y="304" width="465" height="255" rx="8" fill="white" stroke="#ccc" /><text x="502" y="351" font-size="22" font-weight="600" fill="#292929">有尚未保存的更改</text><text x="502" y="395" font-size="16" font-weight="400" fill="#292929">离开前是否保存 AI 模型设置？</text><text x="502" y="428" font-size="14" font-weight="400" fill="#777">检查状态不是配置变更，不触发此确认。</text><a href="#05-api-fallback" data-screen="05-api-fallback"><rect x="502" y="476" width="122" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="516" y="501" font-size="14" font-weight="400" fill="#292929">继续编辑</text></a><a href="#01-home" data-screen="01-home"><rect x="639" y="476" width="122" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="653" y="501" font-size="14" font-weight="400" fill="#292929">放弃更改</text></a><a href="#01-home" data-screen="01-home"><rect x="776" y="476" width="140" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="790" y="501" font-size="14" font-weight="400" fill="#292929">保存并离开</text></a></svg><text x="8" y="507" font-size="15" fill="#333">47 · 全局设置 · 未保存离开确认</text></g></svg>