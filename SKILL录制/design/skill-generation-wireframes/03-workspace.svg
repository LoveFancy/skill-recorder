<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="1200" height="900" rx="0" fill="#f2f2f2" stroke="#ccc" /><text x="30" y="30" font-size="13" font-weight="400" fill="#777">技能录制器 · 原窗口保留在后方</text><rect x="48" y="54" width="1104" height="798" rx="14" fill="white" stroke="#ccc" /><rect x="48" y="54" width="252" height="798" rx="14" fill="#f7f7f7" stroke="#ccc" /><text x="78" y="99" font-size="24" font-weight="600" fill="#292929">设置</text><a href="#01-home" data-screen="01-home"><text x="1110" y="98" font-size="26" font-weight="400" fill="#292929">×</text></a><a href="#01-home" data-screen="01-home"><text x="78" y="148" font-size="16" font-weight="400" fill="#292929">‹ 返回应用</text></a><a href="#30-general" data-screen="30-general"><text x="86" y="209" font-size="16" font-weight="400" fill="#292929">通用</text></a><a href="#31-browser" data-screen="31-browser"><text x="86" y="266" font-size="16" font-weight="400" fill="#292929">浏览器插件</text></a><a href="#05-api-fallback" data-screen="05-api-fallback"><text x="86" y="323" font-size="16" font-weight="400" fill="#292929">AI 模型</text></a><a href="#02-settings" data-screen="02-settings"><rect x="66" y="352" width="216" height="44" rx="8" fill="#e8e8e8" stroke="#ccc" /><text x="86" y="380" font-size="16" font-weight="600" fill="#292929">Agent 能力</text></a><a href="#32-capture-settings" data-screen="32-capture-settings"><text x="86" y="437" font-size="16" font-weight="400" fill="#292929">语音转写</text></a><a href="#37-privacy-settings" data-screen="37-privacy-settings"><text x="86" y="494" font-size="16" font-weight="400" fill="#292929">隐私保护</text></a><text x="78" y="787" font-size="12" font-weight="400" fill="#777">所有页面共用这些配置</text><text x="78" y="810" font-size="12" font-weight="400" fill="#777">不会自动修改当前运行任务</text><text x="338" y="98" font-size="14" font-weight="400" fill="#777">设置  /  Agent 能力</text><text x="350" y="155" font-size="25" font-weight="600" fill="#292929">专用环境说明</text><text x="350" y="187" font-size="14" font-weight="400" fill="#777">无需用户创建或关联项目；此页仅说明来源、存储与隔离边界。</text><a href="#02-settings" data-screen="02-settings"><rect x="350" y="215" width="150" height="38" rx="8" fill="#f4f4f4" stroke="#ccc" /><text x="364" y="240" font-size="14" font-weight="400" fill="#292929">‹ 返回环境</text></a><text x="350" y="297" font-size="19" font-weight="600" fill="#292929">1. 读取全局来源</text><text x="350" y="330" font-size="14" font-weight="400" fill="#292929">读取已核验的用户级 MCP 配置与全局 Skills；保留来源和同步时间。</text><text x="350" y="364" font-size="13" font-weight="400" fill="#777">不扫描其他项目；不把全局 CLAUDE.md、hooks 或宽泛权限整份复制。</text><text x="350" y="430" font-size="19" font-weight="600" fill="#292929">2. 生成应用专用配置</text><text x="350" y="463" font-size="14" font-weight="400" fill="#292929">保存你选择的 MCP / Skills；环境由应用自动创建和管理。</text><text x="350" y="497" font-size="13" font-weight="400" fill="#777">复用现有 Claude 登录；尽量引用凭据，避免复制令牌或在界面展示密钥。</text><text x="350" y="562" font-size="19" font-weight="600" fill="#292929">3. 每次任务固定版本</text><text x="350" y="595" font-size="14" font-weight="400" fill="#292929">任务绑定配置版本、启用清单和能力来源哈希；更改只影响后续任务。</text><text x="350" y="629" font-size="13" font-weight="400" fill="#777">已关闭能力必须不被加载；保存成功不能冒充权限隔离或连接核验成功。</text><rect x="350" y="694" width="750" height="111" rx="8" fill="#f3f3f3" stroke="#ccc" /><text x="370" y="726" font-size="17" font-weight="600" fill="#292929">启动能力可能执行本机程序</text><text x="370" y="759" font-size="13" font-weight="400" fill="#292929">主动连接 MCP 会启动配置进程，可能要求 OAuth；Skills 的资源也需审查。</text><text x="370" y="786" font-size="13" font-weight="400" fill="#292929">读取配置 ≠ 启动连接 ≠ 执行业务操作，三者分开授权。</text></svg>