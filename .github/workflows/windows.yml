name: Windows

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            dist_script: dist:win:x64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate source installer guardrails
        shell: powershell
        run: |
          $path = (Resolve-Path "install.ps1").Path
          & .\scripts\install-windows.test.ps1 -InstallerPath $path
          $beforeErrorPreference = $ErrorActionPreference
          $beforeProgressPreference = $ProgressPreference
          $env:SKILL_RECORDER_COMMIT = "main"
          try {
            & .\install.ps1
            throw "install.ps1 accepted a mutable source reference"
          } catch {
            if ($_.Exception.Message -notmatch "full 40-character") {
              throw
            }
          } finally {
            Remove-Item Env:SKILL_RECORDER_COMMIT -ErrorAction SilentlyContinue
          }
          if (
            $ErrorActionPreference -ne $beforeErrorPreference -or
            $ProgressPreference -ne $beforeProgressPreference
          ) {
            throw "install.ps1 leaked preference changes into the caller"
          }

      - name: Test commit-pinned source installation
        if: github.repository == 'microsoft/skill-recorder'
        shell: powershell
        env:
          SKILL_RECORDER_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SKILL_RECORDER_INSTALL_ROOT: ${{ runner.temp }}\skill-recorder-source
          SKILL_RECORDER_NO_LAUNCH: "1"
        run: .\install.ps1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          architecture: ${{ matrix.arch }}
          cache: npm

      - name: Set up Go native browser bridge
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.1'
          cache: false

      - name: Install required npm version
        run: npm install --global npm@11.17.0

      - name: Validate lockfile portability
        run: npm run check:lockfile

      - name: Cache compliance source downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .compliance-cache
          key: compliance-windows-${{ matrix.arch }}-${{ hashFiles('third_party/compliance-policy.json') }}
          restore-keys: compliance-windows-${{ matrix.arch }}-

      - name: Install native dependencies
        shell: pwsh
        run: |
          if ((node -p "process.arch") -ne "${{ matrix.arch }}") {
            throw "Expected Node ${{ matrix.arch }}"
          }
          npm ci --ignore-scripts=false --dangerously-allow-all-scripts=false --strict-allow-scripts
          node -e "require('sharp'); require('koffi')"
          if (Select-String -Path package-lock.json -Pattern 'ffmpeg-static' -Quiet) {
            throw "ffmpeg-static remains in the lockfile"
          }

      - name: Build native browser bridge before integration tests
        run: npm run build:browser-host

      - name: Generate license inventory
        run: npm run compliance:licenses

      - name: Run tests
        run: npm test

      - name: Typecheck evaluation harness
        run: npm run typecheck:evals

      - name: Build
        run: npm run build

      - name: Cache bundled SenseVoice model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .models
          key: sensevoice-int8-${{ hashFiles('common/sensevoice-model.ts') }}

      - name: Package native installer
        run: npm run ${{ matrix.dist_script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify packaged architecture
        run: node scripts/verify-windows-package.mjs ${{ matrix.arch }}

      - name: Verify bundled offline speech inference
        run: node scripts/smoke-bundled-sensevoice.mjs

      - name: Package smaller test update without model
        run: node scripts/package-test-update.mjs

      - name: Upload smaller test update
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skill-recorder-windows-x64-test-update
          path: release/*-test-update.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skill-recorder-windows-${{ matrix.arch }}
          path: release/*-windows-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload compliance companion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skill-recorder-windows-x64-compliance
          path: .compliance/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
